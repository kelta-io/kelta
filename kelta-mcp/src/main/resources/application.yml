server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: kelta-mcp
  # kelta-mcp reads no database and no Redis, but runtime-core puts HikariCP, the Postgres driver
  # and Lettuce on its classpath, so Spring Boot auto-configures a DataSource (plus the db health
  # contributor) and a Redis connection factory. Until KLT-750 these values came from
  # runtime-core's jar-packaged application.properties; without a URL the DataSource cannot pick
  # a driver and the context fails to start. Neither is connected until something asks.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kelta}
    username: ${SPRING_DATASOURCE_USERNAME:kelta}
    password: ${SPRING_DATASOURCE_PASSWORD:kelta}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  lifecycle:
    timeout-per-shutdown-phase: 30s

kelta:
  mcp:
    gateway-url: ${GATEWAY_URL:http://emf-gateway:80}
    session-ttl-minutes: ${MCP_SESSION_TTL_MINUTES:30}
    tool-timeout-ms: ${MCP_TOOL_TIMEOUT_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true
  opentelemetry:
    # Every replica must carry a distinct service.instance.id, or the OTLP resource for
    # kelta-mcp is identical across pods and Mimir merges all replicas' counters into one
    # series — rate() then treats every replica switch as a counter reset and adds the whole
    # counter value back, inflating request-rate panels. ${HOSTNAME} is the pod name in
    # Kubernetes (unique per replica) and still resolves outside it (container/host id).
    resource-attributes:
      service.instance.id: ${HOSTNAME:local}
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  tracing:
    export:
      enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    propagation:
      type: w3c
