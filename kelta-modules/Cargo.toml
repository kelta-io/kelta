# Rust workspace for external Kelta modules (module-platform part 9f).
#
# Each member is an HTTP service or library that runs OUTSIDE the platform. Nothing here is in the
# kelta-platform Maven reactor; CI checks it with the `test-rust-modules` job and Build and Deploy
# builds the billing image from kelta-modules/Dockerfile.
[workspace]
resolver = "3"
members = ["sdk-rust", "billing"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/kelta-io/kelta"

[workspace.dependencies]
axum = "0.8"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
