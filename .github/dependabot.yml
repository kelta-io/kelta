# Dependabot version updates. Documented in .claude/docs/ci-cd.md → Dependabot.
#
# Every ecosystem gets one weekly group for minor + patch bumps and one for major bumps.
# The major group is split per dependency (group-by: dependency-name), so a major bump
# arrives as ONE PR covering every directory that uses it (not one PR per directory) and
# can still be reviewed and tested on its own. GitHub Actions majors share one PR.
# Maven and npm majors also wait 7 days after release (cooldown) so a broken x.0.0 is not
# proposed; Dependabot supports semver-*-days only for those ecosystems, not docker or actions.
#
# There is no root pom.xml: each Maven root below is built separately. The root
# package-lock.json is an empty stub with no package.json, so "/" is not an npm entry.
version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /kelta-platform
      - /kelta-gateway
      - /kelta-worker
      - /kelta-auth
      - /kelta-ai
      - /kelta-mcp
      - /kelta-test-harness
      - /kelta-modules/billing-jar
    schedule:
      interval: weekly
    # Platform upgrades are planned work, not Dependabot batches: a Spring Boot bump (even
    # the 4.0.5 -> 4.0.9 patch line) broke tenant creation in E2E (PLT-767), and the GraalVM
    # polyglot/js runtime must stay on the GraalVM JDK line the native builds use (25.0.x);
    # Dependabot proposed 25.0.2 -> 25.4.4.1.1. Spring Boot / Spring Cloud move only through a
    # task; org.graalvm.* gets patch bumps only.
    ignore:
      - dependency-name: "org.springframework.boot:*"
      - dependency-name: "org.springframework.cloud:*"
      - dependency-name: "org.graalvm.*:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      maven-major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - major
    cooldown:
      semver-major-days: 7

  - package-ecosystem: npm
    directories:
      - /kelta-web
      - /kelta-ui
      - /kelta-ui/app
      - /kelta-marketing
      - /e2e-tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ESLint 10 waits for eslint-plugin-jsx-a11y (latest 6.10.2 peers on eslint <=9; PLT-815,
    # 2026-10-25). A lone @eslint/js 10 bump breaks npm install (kelta#2027). Remove these
    # entries when jsx-a11y ships ESLint 10 support.
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies
    groups:
      # OpenTelemetry JS packages must move as one set: their experimental 0.x packages
      # (instrumentation-*, exporter-*) pin the stable 1.x/2.x core they were built with, so a
      # 0.52 -> 0.300 "minor" bump alone breaks npm ci on peer ranges (kelta#1916). Listed first
      # so @opentelemetry/* never lands in npm-minor-patch or npm-major.
      opentelemetry-js:
        patterns:
          - "@opentelemetry/*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - major
    cooldown:
      semver-major-days: 7

  # Covers Dockerfile and the Dockerfile.* variants (.jvm, .migrate, .ci). A FROM whose
  # image comes from a build ARG (FROM ${GRAALVM_IMAGE}, FROM ${BASE_REGISTRY}/...)
  # cannot be resolved by Dependabot and is left alone.
  - package-ecosystem: docker
    directories:
      - /.github/runner
      - /docker/bootstrap
      - /docker/cerbos
      - /kelta-ai
      - /kelta-auth
      - /kelta-cli-downloads
      - /kelta-gateway
      - /kelta-marketing
      - /kelta-mcp
      - /kelta-modules
      - /kelta-ui
      - /kelta-web
      - /kelta-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      docker-major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - major

  # The Rust external modules (kelta-modules/Cargo.toml workspace: the kelta-module SDK and
  # kelta-billing). One lockfile covers both crates.
  - package-ecosystem: cargo
    directory: /kelta-modules
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      cargo-major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
