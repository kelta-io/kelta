name: Feature request
description: Suggest a generic platform capability for Kelta Platform
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's stopping you today?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like Kelta to do?
    validations:
      required: false
  - type: textarea
    id: generic-platform-fit
    attributes:
      label: Generic platform fit
      description: >-
        Kelta only accepts generic, tenant-configurable capabilities — nothing
        tenant-specific or vendor-specific gets hard-coded into the platform (see
        CLAUDE.md "Critical Rule 0"). Describe how this would be expressed as
        metadata (a collection, field type, flow action, permission, etc.) that any
        tenant could configure, rather than a one-off for a single use case.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried, or other approaches you considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, mockups, or examples from other tools.
    validations:
      required: false
