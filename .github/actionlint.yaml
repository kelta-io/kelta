# actionlint configuration.
#
# Jobs here run on self-hosted runners; without declaring their labels actionlint
# reports 22 "unknown label" findings and drowns out the real ones.
#   kelta-small, kelta-medium, kelta-large — the three homelab ARC sizes shared by every
#   kelta-io job (homelab-argo arc/README.md → kelta-io sizes)
self-hosted-runner:
  labels:
    - kelta-small
    - kelta-medium
    - kelta-large
