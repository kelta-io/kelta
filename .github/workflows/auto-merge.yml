# Auto-merge for autopilot PRs.
#
# Two paths, one rule: a fleet PR merges only after rzware-reviewer[bot] approves it.
#
#   fleet   — PRs opened by rzware-developer[bot]. The worker Job (cklinker/rzware-ceo,
#             agents/worker/run.sh) opens the PR, has rzware-reviewer[bot] review it, fixes
#             and pushes when changes are requested, and reviews again. Auto-merge is enabled
#             here ONLY when the reviewer's review is `approved`, and disabled again if a later
#             review requests changes. Enabling it on the `autopilot` label (the previous
#             behaviour) merged PRs on CI green while the review round was still running —
#             #1478 merged eleven minutes after its "changes requested", and the fix commit was
#             stranded on the branch (#1479).
#   human   — PRs opened by cklinker or github-actions[bot] carrying the `autopilot` label
#             keep the old behaviour: auto-merge on label, no review gate.
#
# Merges use a PAT (ARGOCD_REPO_TOKEN, `repo` scope) rather than GITHUB_TOKEN: a push made
# with GITHUB_TOKEN never triggers this repo's other workflows, so `Build and Deploy`
# would not fire on the squash-merge.
name: Auto-merge autopilot PRs

on:
  pull_request:
    types: [opened, labeled, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  human:
    name: Enable squash auto-merge (human PR)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autopilot') &&
      (github.event.pull_request.user.login == 'cklinker' ||
       github.event.pull_request.user.login == 'github-actions[bot]') &&
      github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto --squash \
            --repo "${{ github.repository }}"

  fleet:
    name: Enable squash auto-merge (fleet PR, reviewer approved)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'rzware-reviewer[bot]' &&
      github.event.pull_request.user.login == 'rzware-developer[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'autopilot') &&
      github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto --squash \
            --repo "${{ github.repository }}"

  fleet-hold:
    name: Disable auto-merge (fleet PR, changes requested)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.login == 'rzware-reviewer[bot]' &&
      github.event.pull_request.user.login == 'rzware-developer[bot]'
    steps:
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --disable-auto \
            --repo "${{ github.repository }}" || true
