name: Gitleaks Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          tmp="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 -o "$tmp" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.19.0/gitleaks_8.19.0_linux_x64.tar.gz
          tar -xzf "$tmp" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks detect
        run: gitleaks detect --config .gitleaks.toml --no-banner
