name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  # 20 to match kelta-ui/Dockerfile (node:20-alpine) — CI was validating against a Node
  # the shipped image is not built with. It is also the floor for kelta-ui/app's vitest
  # suite: on 18, jsdom's html-encoding-sniffer require()s an ES module, so all 223 test
  # files fail to start (ERR_REQUIRE_ESM) before a single test runs.
  NODE_VERSION: '20'
  MAVEN_VERSION: '3.9.9'
  # Survive transient Maven Central 429 / 503 / connection resets. Both the
  # legacy wagon HTTP transport and the newer Aether connector retry up to 10
  # times with exponential backoff and honour Retry-After headers. The empty
  # default that lived here previously was overriding a runner-level value —
  # set the retry flags explicitly so every `mvn` call picks them up.
  MAVEN_OPTS: "-Dmaven.wagon.http.retryHandler.count=10 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true -Daether.connector.http.retryHandler.count=10"

jobs:
  # ===========================================================================
  # Detect which paths changed in this PR so downstream jobs can skip work
  # that isn't relevant. Uses shared filter file at .github/path-filters.yml.
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: k8s-runner
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      gateway: ${{ steps.filter.outputs.gateway }}
      worker: ${{ steps.filter.outputs.worker }}
      auth: ${{ steps.filter.outputs.auth }}
      ai: ${{ steps.filter.outputs.ai }}
      mcp: ${{ steps.filter.outputs.mcp }}
      web: ${{ steps.filter.outputs.web }}
      ui: ${{ steps.filter.outputs.ui }}
      marketing: ${{ steps.filter.outputs.marketing }}
      any_java: ${{ steps.filter.outputs.any_java }}
      e2e: ${{ steps.filter.outputs.e2e }}
      runtime_modules: ${{ steps.filter.outputs.runtime_modules }}
      quickstart: ${{ steps.filter.outputs.quickstart }}
      workflows: ${{ steps.filter.outputs.workflows }}
      dora: ${{ steps.filter.outputs.dora }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # paths-filter needs full history to diff against PR base
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.yml

  # ===========================================================================
  # Build runtime + test changed Java services in parallel
  # Each matrix entry runs only if its service (or runtime) changed.
  # Runtime change cascades to every service via the filter file.
  # ===========================================================================
  test-java:
    name: Test ${{ matrix.service }}
    needs: changes
    # k8s-runner-integration, like the harness job: its Docker publishes container ports where
    # the job can reach them. On k8s-runner, Testcontainers starts the container but
    # getHost():getMappedPort() is "Connection refused", so the Testcontainers ITs
    # (RowLevelSecurityIntegrationTest, …) cannot run there — they used to be skipped instead.
    runs-on: k8s-runner-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            changed: ${{ needs.changes.outputs.gateway }}
          - service: worker
            changed: ${{ needs.changes.outputs.worker }}
          - service: auth
            changed: ${{ needs.changes.outputs.auth }}
          - service: ai
            changed: ${{ needs.changes.outputs.ai }}
          - service: mcp
            changed: ${{ needs.changes.outputs.mcp }}
    if: needs.changes.outputs.any_java == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true' && needs.changes.outputs.workflows != 'true'
        run: |
          echo "No changes affecting ${{ matrix.service }} — skipping."
          exit 0

      - name: Checkout code
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Maven
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> $GITHUB_PATH
          fi
          # Route all Maven traffic through the homelab Nexus proxy so direct
          # mvn calls on the runner share the same mirror as the Docker builds
          # (otherwise harness builds hit Maven Central directly and 429 us).
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Build runtime modules
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        run: mvn clean install -DskipTests -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-messaging-nats,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema -am -B

      - name: Test ${{ matrix.service }}
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        env:
          # Ryuk (Testcontainers' reaper) can't be reached on this runner's shared Docker
          # daemon, and without this Testcontainers reports "no Docker" — every
          # @Testcontainers(disabledWithoutDocker = true) suite is then SKIPPED and the job
          # stays green. Same setting as the harness job below.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn verify -f kelta-${{ matrix.service }}/pom.xml -B

      - name: Assert integration tests ran (not skipped)
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        run: scripts/ci/assert-integration-tests-ran.sh kelta-${{ matrix.service }}/target/surefire-reports kelta-${{ matrix.service }}/target/failsafe-reports

      - name: Upload test results
        # Artifact upload occasionally hits transient ENOTFOUND on the self-
        # hosted runner — don't let that mask a green test run.
        continue-on-error: true
        if: always() && (matrix.changed == 'true' || needs.changes.outputs.workflows == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results-${{ matrix.service }}
          path: kelta-${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        continue-on-error: true
        if: always() && (matrix.changed == 'true' || needs.changes.outputs.workflows == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage-${{ matrix.service }}
          path: kelta-${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Test the runtime modules themselves.
  #
  # The test-java matrix above builds them with -DskipTests and then only runs
  # `mvn verify` against kelta-<service>, so until this job existed the runtime
  # modules' ~1,900 tests were compiled and never executed — including the query
  # engine, the storage adapters and their DDL/SQL generation, the flow engine,
  # validation and TenantContext. A FORMULA regression (#1281) consequently sat
  # on green main for eleven days with its own test failing.
  #
  # Runs as its own job rather than by dropping -DskipTests above, so the suite
  # executes once instead of once per service, and reports its own status check.
  # ===========================================================================
  test-runtime:
    name: Test Runtime Modules
    needs: changes
    runs-on: k8s-runner-integration   # Testcontainers ITs — see test-java
    if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> $GITHUB_PATH
          fi
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Test runtime modules
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"   # see the test-java job
        run: mvn test -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-messaging-nats,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema -am -B

      - name: Assert integration tests ran (not skipped)
        run: scripts/ci/assert-integration-tests-ran.sh kelta-platform/runtime/*/target/surefire-reports

      - name: Upload test results
        # Artifact upload occasionally hits transient ENOTFOUND on the self-
        # hosted runner — don't let that mask a green test run.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results-runtime
          path: kelta-platform/runtime/*/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Build + test runtime-installable modules (kelta-modules/**).
  #
  # These are deliberately OUTSIDE the kelta-platform reactor — they ship as
  # signed JARs installed into a tenant at runtime, not with the platform — so
  # nothing else in CI compiles them. Without this job a change to KeltaModule,
  # ActionHandler, ModuleContext or any SPI type they use breaks every shipped
  # module silently, and the break only surfaces when an operator uploads one.
  #
  # Each module is built independently (no aggregator pom, by design), so the
  # loop installs the platform artifacts first and then runs each module's own
  # build against them.
  # ===========================================================================
  test-runtime-modules:
    name: Test Runtime Modules (installable)
    needs: changes
    runs-on: k8s-runner
    if: needs.changes.outputs.runtime_modules == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> $GITHUB_PATH
          fi
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Install platform artifacts modules compile against
        run: mvn install -DskipTests -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema,runtime/runtime-messaging-nats -am -B

      - name: Build and test each installable module
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for pom in kelta-modules/*/pom.xml; do
            found=1
            echo "::group::$(dirname "$pom")"
            mvn verify -f "$pom" -B
            echo "::endgroup::"
          done
          if [[ "$found" -eq 0 ]]; then
            echo "No installable modules found under kelta-modules/ — nothing to build."
          fi

      - name: Upload test results
        # Artifact upload occasionally hits transient ENOTFOUND on the self-
        # hosted runner — don't let that mask a green test run.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results-runtime-modules
          path: kelta-modules/*/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Test Frontend (lint, typecheck, unit tests with coverage)
  # Runs when kelta-web or kelta-ui changed (ui depends on web).
  # ===========================================================================
  test-frontend:
    name: Test Frontend
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: k8s-runner
    defaults:
      run:
        working-directory: kelta-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('kelta-web/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      # -----------------------------------------------------------------------
      # kelta-ui/app types. The prod image builds with bare `vite build`, which
      # skips tsc entirely — so without this step nothing validates kelta-ui/app
      # types and errors accumulate silently on main (22 had, when this was added).
      #
      # kelta-ui/app resolves @kelta/* through the built dist/*.d.ts of the
      # kelta-web packages, so those must be built first or the typecheck
      # reports phantom "has no exported member" errors against a stale dist.
      # -----------------------------------------------------------------------
      - name: Build kelta-web packages (kelta-ui type resolution)
        run: |
          npm run build --workspace=packages/formula
          npm run build --workspace=packages/sdk
          npm run build --workspace=packages/plugin-sdk
          npm run build --workspace=packages/components

      - name: Install kelta-ui dependencies
        working-directory: kelta-ui/app
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5

      - name: Type check kelta-ui
        working-directory: kelta-ui/app
        run: npm run typecheck

      # kelta-ui/app carries 223 vitest files / ~2,700 tests — the admin+builder and
      # end-user UI, the page builder, record shell, realtime client. Until this step
      # existed the job only typechecked them, so none of it ever gated anything.
      - name: Test kelta-ui
        working-directory: kelta-ui/app
        run: npm run test:run

      # PLT-250: ReportViewPage's export race and FieldEditor's async-submission test both
      # timed out intermittently under CI-load contention (concerns.md → "Frontend suite
      # starves under concurrent image builds"), never locally. The fix removed the
      # underlying race/render-count instead of raising the shared asyncUtilTimeout, so
      # re-run each fixed file 5x consecutively here — this job's own log is the evidence,
      # not a one-off green.
      - name: Stability check — previously-flaky tests (5x consecutive)
        working-directory: kelta-ui/app
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::ReportViewPage.test.tsx run $i/5"
            npm run test:run -- src/pages/app/ReportViewPage/ReportViewPage.test.tsx
            echo "::endgroup::"
          done
          for i in 1 2 3 4 5; do
            echo "::group::FieldEditor.test.tsx run $i/5"
            npm run test:run -- src/components/FieldEditor/FieldEditor.test.tsx
            echo "::endgroup::"
          done

      - name: Upload coverage report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: kelta-web/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Cross-service integration tests (Testcontainers harness)
  # Skipped on docs / frontend-only PRs. Runtime or any Java service change
  # forces a full integration run via the any_java filter.
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    needs: [changes, test-java]
    if: needs.changes.outputs.any_java == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: k8s-runner-integration
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> $GITHUB_PATH
          fi
          # Route all Maven traffic through the homelab Nexus proxy so direct
          # mvn calls on the runner share the same mirror as the Docker builds
          # (otherwise harness builds hit Maven Central directly and 429 us).
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Build runtime modules
        run: mvn clean install -DskipTests -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-messaging-nats,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema -am -B

      - name: Build service JARs (required by test harness)
        run: |
          mvn install -DskipTests -f kelta-auth/pom.xml -B
          mvn install -DskipTests -f kelta-worker/pom.xml -B
          mvn install -DskipTests -f kelta-gateway/pom.xml -B

      - name: Pre-pull Docker images
        run: |
          docker pull redis:7-alpine
          docker pull nats:2.10-alpine
          docker pull ghcr.io/cerbos/cerbos:0.40.0
          docker pull eclipse-temurin:25-jre-alpine

      - name: Install psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      # Disabled: the kelta-ci-db pool path was timing out under load. Leaving
      # CI_DB_JDBC_URL unset makes the harness fall back to per-test
      # testcontainers-managed postgres (the "Local dev" branch), which is
      # what integration tests have effectively been running on for months
      # (the checkout step was silently failing and the eval swallowed the
      # error). Re-enable once the pool is reliable enough.
      - name: Checkout CI DB schema
        if: false
        run: |
          eval "$(scripts/ci/checkout-db.sh)"
          echo "::add-mask::$CI_DB_PASSWORD"
          {
            echo "CI_DB_JDBC_URL=$CI_DB_JDBC_URL"
            echo "CI_DB_USER=$CI_DB_USER"
            echo "CI_DB_PASSWORD=$CI_DB_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Pre-build service images
        run: |
          for service in kelta-worker kelta-auth kelta-gateway; do
            jar="${service}/target/${service}-1.0.0-SNAPSHOT.jar"
            ctx=$(mktemp -d)
            cp "$jar" "$ctx/app.jar"
            cat > "$ctx/Dockerfile" <<'EOF'
          FROM eclipse-temurin:25-jre-alpine
          COPY app.jar /app.jar
          ENTRYPOINT ["java", "-Xmx512m", "-XX:MaxMetaspaceSize=256m", "-jar", "/app.jar"]
          EOF
            docker build -t "${service}-harness" "$ctx"
            rm -rf "$ctx"
            echo "Built ${service}-harness"
          done

      - name: Run cross-service harness
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          KELTA_HARNESS_PREBUILT_IMAGES: "true"
          MAVEN_OPTS: "-Xmx1g -XX:MaxMetaspaceSize=384m -Dmaven.wagon.http.retryHandler.count=10 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true -Daether.connector.http.retryHandler.count=10"
        run: mvn verify -f kelta-test-harness/pom.xml -Pintegration-tests -B

      - name: Upload harness reports
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-failsafe-reports
          path: kelta-test-harness/target/failsafe-reports/
          retention-days: 7

      - name: Release CI DB schema
        if: false
        run: scripts/ci/release-db.sh

  # ===========================================================================
  # E2E tests (Playwright) — spins up the full docker-compose stack using the
  # JVM-mode service Dockerfiles from docker-compose.ci.yml so PR feedback stays
  # under ~25 min instead of the ~50 min a native GraalVM build would cost.
  # Native images are still validated post-merge by build-and-publish-containers.yml.
  # ===========================================================================
  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: k8s-runner-integration
    timeout-minutes: 45
    # Per-branch concurrency: cancel an in-flight run when the PR is updated.
    # Cross-PR isolation comes from docker-compose.ci.yml dropping host port
    # bindings and COMPOSE_PROJECT_NAME namespacing container names; Playwright
    # runs inside a container on the compose network so no host ports are needed.
    concurrency:
      group: e2e-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate .env (JWK_SET + encryption key)
        run: make setup

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build kelta CLI (agent-authoring benchmark drives it directly — kelta-mcp is not in CI compose)
        working-directory: kelta-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build service images (JVM, GHA cache)
        run: |
          docker buildx bake \
            -f docker-compose.yml -f docker-compose.ci.yml \
            --set "*.cache-from=type=gha,scope=e2e-ci-jvm" \
            --set "*.cache-to=type=gha,mode=max,scope=e2e-ci-jvm" \
            --load \
            kelta-auth kelta-worker kelta-gateway kelta-ui cerbos

      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --wait --wait-timeout 300

      - name: Seed admin + verify health
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile seed run --rm kelta-bootstrap

      - name: Build Playwright runner image (tests + CLI baked in)
        # Bake e2e-tests + node_modules into a runner image. Bind-mounting the
        # workspace doesn't work with the k8s-runner-integration remote Docker
        # daemon (the daemon host can't see the runner's filesystem).
        #
        # Build context is the repo root (not e2e-tests) so the image can also carry
        # the built kelta-web tree (dist/ + hoisted node_modules — the CLI's own
        # package.json has no deps of its own to bundle, they resolve up to
        # kelta-web/node_modules via normal workspace hoisting) at /kelta-web.
        # agent-authoring.spec.ts resolves the CLI via
        # `../../kelta-web/packages/cli/dist/index.js` from /work/tests, the same
        # relative path cli-smoke.spec.ts already uses.
        run: |
          # Image tag must match the @playwright/test version in package-lock.json
          # (resolved from ^1.50.0 → currently 1.58.2). Update both together.
          docker build -t kelta-e2e-runner:local -f - . <<'DOCKERFILE'
          FROM mcr.microsoft.com/playwright:v1.58.2-noble
          WORKDIR /work
          COPY e2e-tests/package.json e2e-tests/package-lock.json ./
          RUN npm ci
          COPY e2e-tests/ .
          COPY kelta-web /kelta-web
          DOCKERFILE

      - name: Run Playwright tests (sibling container on compose network)
        id: playwright
        run: |
          NETWORK="${COMPOSE_PROJECT_NAME}_kelta-network"
          CONTAINER="${COMPOSE_PROJECT_NAME}_kelta-e2e-run"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run --name "$CONTAINER" \
            --network "$NETWORK" \
            -e CI=true \
            -e E2E_BASE_URL=http://kelta-ui:8080 \
            -e E2E_API_BASE_URL=http://kelta-gateway:8080 \
            -e E2E_AUTH_BASE_URL=http://kelta-auth:8080 \
            -e E2E_AUTH_DIRECT_LOGIN_URL=http://kelta-auth:8080 \
            -e E2E_TENANT_SLUG=default \
            -e E2E_TEST_USERNAME=admin \
            -e E2E_TEST_PASSWORD=password \
            kelta-e2e-runner:local \
            npx playwright test

      - name: Copy Playwright reports out of container
        if: always() && steps.playwright.outcome != 'skipped'
        run: |
          CONTAINER="${COMPOSE_PROJECT_NAME}_kelta-e2e-run"
          mkdir -p e2e-tests/playwright-report e2e-tests/test-results
          docker cp "$CONTAINER":/work/playwright-report/. e2e-tests/playwright-report/ 2>/dev/null || true
          docker cp "$CONTAINER":/work/test-results/. e2e-tests/test-results/ 2>/dev/null || true
          docker rm -f "$CONTAINER" || true

      - name: Report agent-authoring benchmark request count
        if: always() && steps.playwright.outcome != 'skipped'
        run: |
          COUNT_FILE="e2e-tests/test-results/agent-authoring-request-count.txt"
          if [ -f "$COUNT_FILE" ]; then
            COUNT="$(cat "$COUNT_FILE")"
            echo "### Agent-authoring benchmark (K-9)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "HTTP requests for the full authoring sequence (layouts x2, list-views x4, dashboard, page apply+publish, menu): **${COUNT} / 20**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Agent-authoring benchmark (K-9)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No request-count report found (agent-authoring.spec.ts did not run or was skipped)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p _logs
          for s in kelta-auth kelta-worker kelta-gateway kelta-ui postgres redis nats cerbos; do
            docker compose -f docker-compose.yml -f docker-compose.ci.yml \
              logs --no-color "$s" > "_logs/${s}.log" 2>&1 || true
          done

      - name: Upload e2e artifacts
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
            _logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack + remove volumes
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile ai --profile tools --profile seed down -v || true

  # ===========================================================================
  # Quickstart smoke test (K-3) — proves the documented "clone → docker compose
  # up → create your first collection" path actually works and stays fast.
  #
  # Images are built ahead of the timer (JVM Dockerfiles via docker-compose.ci.yml,
  # same port-safe/name-safe overlay the e2e job uses — the k8s-runner shares a
  # Docker daemon so fixed host ports collide across concurrent jobs). Only the
  # wall clock from `docker compose up` to a successful first-collection API call
  # counts against the 300s budget; a `timeout 300` around that exact sequence
  # enforces it regardless of where the time goes. This deliberately does NOT use
  # `make up`/`make up-ai` — GraalVM native-image compiles take ~10 min per
  # service and cannot fit any CI budget; native still ships in production via
  # build-and-publish-containers.yml.
  # ===========================================================================
  quickstart:
    name: Quickstart Smoke Test
    needs: changes
    if: needs.changes.outputs.quickstart == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: k8s-runner-integration
    timeout-minutes: 20
    concurrency:
      group: quickstart-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: qs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate .env (JWK_SET + encryption key)
        run: make setup

      - name: Build service images (JVM, GHA cache)
        run: |
          docker buildx bake \
            -f docker-compose.yml -f docker-compose.ci.yml \
            --set "*.cache-from=type=gha,scope=e2e-ci-jvm" \
            --set "*.cache-to=type=gha,mode=max,scope=e2e-ci-jvm" \
            --load \
            kelta-auth kelta-worker kelta-gateway kelta-ui cerbos

      - name: Pre-pull curl image (kept out of the timed window)
        run: docker pull curlimages/curl:8.11.0

      - name: 'Time: stack start → first collection created (budget 300s)'
        run: |
          set +e
          START=$(date +%s)
          timeout 300 bash ci/quickstart-run.sh
          RESULT=$?
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "Quickstart wall-clock (stack start → first collection created): ${ELAPSED}s"
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Quickstart did not complete within the 300s budget (timeout or failure) — ${ELAPSED}s elapsed."
            exit 1
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p _logs
          for s in kelta-auth kelta-worker kelta-gateway kelta-ui postgres redis nats cerbos mailpit; do
            docker compose -f docker-compose.yml -f docker-compose.ci.yml \
              logs --no-color "$s" > "_logs/${s}.log" 2>&1 || true
          done

      - name: Upload logs
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-logs
          path: _logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack + remove volumes
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true

  # ===========================================================================
  # The worker image must stay JVM.
  #
  # Runtime module loading needs a bytecode interpreter: SandboxedModuleClassLoader defines classes
  # from an uploaded JAR at runtime, which a native image cannot do. Switching the worker to a
  # native build is a one-line change that produces no error anywhere -- every installed module
  # silently loads as inert handlers. This job exists so that change fails here instead.
  # ===========================================================================
  worker-image-is-jvm:
    name: Worker image is JVM
    runs-on: k8s-runner
    steps:
      - uses: actions/checkout@v4
      - name: Assert the worker builds from Dockerfile.jvm
        run: |
          set -euo pipefail
          wf=.github/workflows/build-and-publish-containers.yml
          # The dockerfile line immediately following `- service: worker`.
          actual=$(grep -A1 '^          - service: worker$' "$wf" \
                   | grep 'dockerfile:' | awk '{print $2}')
          echo "worker dockerfile: ${actual}"
          if [ "${actual}" != "kelta-worker/Dockerfile.jvm" ]; then
            echo "::error::The worker image must build from kelta-worker/Dockerfile.jvm, got '${actual}'."
            echo "A native worker cannot classload an uploaded module JAR, so every installed"
            echo "module becomes inert with no error reported anywhere."
            exit 1
          fi

  # ===========================================================================
  # Quality gate — succeeds when every triggered job succeeded.
  # Jobs that skipped (because their paths didn't change) report `skipped`
  # which is not a failure. Only `failure` and `cancelled` block the gate.
  # ===========================================================================
  # ===========================================================================
  # Dependency vulnerability scanning.
  #
  # Before this, the repo had NO dependency scanning of any kind. OWASP
  # dependency-check was declared in kelta-platform/pom.xml with failBuildOnCVSS=7
  # and a suppressions file — but only inside <pluginManagement>, which configures a
  # plugin without ever running one. No module declared it, no workflow invoked it,
  # and the suppressions file is still the untouched template, so no report had ever
  # been reviewed. There was also no npm audit, no Dependabot and no Renovate.
  #
  # npm side gates the DELTA against ci/npm-audit-baseline.json rather than a plain
  # --audit-level=high, because production deps already carry 33 high/critical
  # advisories; a threshold gate would fail on day one and a red main is a deploy
  # outage, not a signal. Every NEW advisory blocks; the backlog stays listed and
  # burn-down-able instead of silently tolerated.
  # ===========================================================================
  dependency-audit:
    name: Dependency Audit (npm)
    needs: changes
    runs-on: k8s-runner
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm audit resolves advisories from the lockfile against the registry; it
      # needs no node_modules, so this deliberately skips the (slow) installs.
      - name: Audit production dependencies
        run: node ci/dependency-audit.mjs

  # ===========================================================================
  # Lint the workflow files themselves.
  #
  # Added after a `secrets` context in an `if:` condition broke this whole file:
  # GitHub exposes `secrets` only to `with:`, `env:` and `run:`, never to `if:`.
  # The failure mode is nastier than a normal red build — the file does not parse,
  # so NO jobs run at all (not even Detect Changes), the run is named after the
  # file path instead of "CI", and the PR looks like CI simply has not started.
  # A YAML parse cannot catch it; actionlint can, and does:
  #   context "secrets" is not allowed here. available contexts are "env", ...
  #
  # Scope, stated openly: shellcheck is OFF. The workflows carry 22 shell findings
  # (19x SC2086 quoting, 2x SC2129 style, 1x SC2034) — all info/style/warning, none
  # errors. Fixing them means editing live CI shell, which is its own change with its
  # own risk; enabling it here would only have blocked this one. Turn it on by
  # dropping `-shellcheck=` once those are cleaned up.
  #
  # The `if: false` ignore is narrow and deliberate: two CI-DB steps are disabled on
  # purpose (see their comments), and actionlint's advice to delete the `if:` is
  # wrong for them.
  # ===========================================================================
  lint-workflows:
    name: Lint Workflows
    needs: changes
    runs-on: k8s-runner
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          curl -fsSL --retry 5 --retry-delay 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin actionlint
          actionlint -version
        env:
          ACTIONLINT_VERSION: 1.7.12

      # Runner labels come from .github/actionlint.yaml; without it the self-hosted
      # pools read as unknown labels and bury the real findings.
      - name: Lint workflows
        run: |
          actionlint -color -shellcheck= \
            -ignore 'constant expression "false" in condition'

  # ===========================================================================
  # Marketing site (kelta.io) — Astro static build + route guards. Node 22 to
  # match kelta-marketing/Dockerfile, which is what actually ships the site.
  # ===========================================================================
  test-marketing:
    name: Test Marketing Site
    needs: changes
    runs-on: k8s-runner
    if: needs.changes.outputs.marketing == 'true' || needs.changes.outputs.workflows == 'true'
    defaults:
      run:
        working-directory: kelta-marketing
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

  # ===========================================================================
  # DORA collector — pure-logic unit tests (scripts/dora/lib.test.mjs). No build.
  # ===========================================================================
  test-dora:
    name: DORA collector tests
    needs: changes
    runs-on: k8s-runner
    if: needs.changes.outputs.dora == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run tests
        run: node --test scripts/dora/lib.test.mjs

      - name: Syntax-check the entry points
        run: |
          node --check scripts/dora/collect.mjs
          node --check scripts/dora/bootstrap-kelta.mjs
          bash -n scripts/dora/emit-deploy-event.sh

  quality-gate:
    name: Quality Gate
    needs: [changes, test-java, test-runtime, test-runtime-modules, test-frontend, test-marketing, integration-tests, e2e, quickstart, worker-image-is-jvm, dependency-audit, lint-workflows, test-dora]
    if: always()
    runs-on: k8s-runner
    steps:
      - name: Check job results
        run: |
          for job in test-java test-runtime test-runtime-modules test-frontend test-marketing integration-tests e2e quickstart worker-image-is-jvm dependency-audit lint-workflows test-dora; do
            result_var="${job//-/_}_result"
            case "${job}" in
              test-java)         result="${{ needs.test-java.result }}" ;;
              test-runtime)      result="${{ needs.test-runtime.result }}" ;;
              test-runtime-modules) result="${{ needs.test-runtime-modules.result }}" ;;
              test-frontend)     result="${{ needs.test-frontend.result }}" ;;
              test-marketing)    result="${{ needs.test-marketing.result }}" ;;
              integration-tests) result="${{ needs.integration-tests.result }}" ;;
              e2e)               result="${{ needs.e2e.result }}" ;;
              quickstart)        result="${{ needs.quickstart.result }}" ;;
              worker-image-is-jvm) result="${{ needs.worker-image-is-jvm.result }}" ;;
              dependency-audit)  result="${{ needs.dependency-audit.result }}" ;;
              lint-workflows)    result="${{ needs.lint-workflows.result }}" ;;
              test-dora)         result="${{ needs.test-dora.result }}" ;;
            esac
            echo "${job}: ${result}"
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "Job ${job} did not pass — quality gate failed."
              exit 1
            fi
          done
          echo "All triggered jobs passed (skipped jobs are allowed)."
