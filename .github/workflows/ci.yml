name: CI

on:
  pull_request:
    branches: [main]
  # Weekly backstop for the templates, mcp-replay and dependency-audit-java jobs alone: on a
  # schedule the path filter is skipped, so every job gated on a filter output skips and only
  # those three (which also accept `schedule`) run, alongside the unconditional
  # worker-image-is-jvm check and the gate. dependency-audit-java is there because advisories are
  # published without any code change here.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      # Manual fallback for the e2e-tests/.update-snapshots marker (see the e2e job's
      # "Regenerate visual baselines" step). Both empty = an ordinary dispatch.
      update_snapshots_ref:
        description: Branch to regenerate Playwright visual baselines on and push to (never main)
        type: string
        required: false
        default: ''
      update_snapshots_specs:
        description: Space-separated spec paths relative to e2e-tests/ (under tests/), e.g. tests/end-user/object-detail-visual.spec.ts
        type: string
        required: false
        default: ''

# A baseline-regeneration dispatch gets its own group per target branch, so two of them
# (both dispatched from main) do not cancel each other.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}${{ inputs.update_snapshots_ref && format('-update-snapshots-{0}', inputs.update_snapshots_ref) || '' }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  # Must equal the node major of the kelta-ui/Dockerfile and kelta-web/Dockerfile builder
  # stages (node:24.x-alpine) — CI was once validating against a Node the shipped images
  # were not built with. Move all three together. Never below 20.19 (kelta-ui/app's
  # engines): on 18, jsdom's html-encoding-sniffer require()s an ES module, so all 223
  # test files fail to start (ERR_REQUIRE_ESM) before a single test runs.
  NODE_VERSION: '24'
  MAVEN_VERSION: '3.9.9'
  # Survive transient Maven Central 429 / 503 / connection resets. Both the
  # legacy wagon HTTP transport and the newer Aether connector retry up to 10
  # times with exponential backoff and honour Retry-After headers. The empty
  # default that lived here previously was overriding a runner-level value —
  # set the retry flags explicitly so every `mvn` call picks them up.
  MAVEN_OPTS: "-Dmaven.wagon.http.retryHandler.count=10 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true -Daether.connector.http.retryHandler.count=10"

# Fork guard. Every job here runs on a self-hosted runner, so no job may run code from a
# fork's pull request. Each job's `if:` is (or is AND-ed with, its original condition kept in
# parentheses) exactly:
#   github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
# Actions has no job-level anchors, so it is repeated per job; quality-gate's always() is
# wrapped too, or it alone would still run. ci/workflow-fork-guard.ts fails a PR-triggered
# self-hosted job without it. A maintainer re-runs a fork's change from a kelta-io/kelta branch.
jobs:
  # ===========================================================================
  # Detect which paths changed in this PR so downstream jobs can skip work
  # that isn't relevant. Uses shared filter file at .github/path-filters.yml.
  # ===========================================================================
  changes:
    name: Detect Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8s-runner
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      gateway: ${{ steps.filter.outputs.gateway }}
      worker: ${{ steps.filter.outputs.worker }}
      auth: ${{ steps.filter.outputs.auth }}
      ai: ${{ steps.filter.outputs.ai }}
      mcp: ${{ steps.filter.outputs.mcp }}
      web: ${{ steps.filter.outputs.web }}
      ui: ${{ steps.filter.outputs.ui }}
      marketing: ${{ steps.filter.outputs.marketing }}
      sdk_docs: ${{ steps.filter.outputs.sdk_docs }}
      cli_docs: ${{ steps.filter.outputs.cli_docs }}
      any_java: ${{ steps.filter.outputs.any_java }}
      integration: ${{ steps.filter.outputs.integration }}
      maven_build: ${{ steps.filter.outputs.maven_build }}
      java_audit: ${{ steps.filter.outputs.java_audit }}
      e2e: ${{ steps.filter.outputs.e2e }}
      runtime_modules: ${{ steps.filter.outputs.runtime_modules }}
      quickstart: ${{ steps.filter.outputs.quickstart }}
      templates: ${{ steps.filter.outputs.templates }}
      mcp_replay: ${{ steps.filter.outputs.mcp_replay }}
      upgrade: ${{ steps.filter.outputs.upgrade }}
      workflows: ${{ steps.filter.outputs.workflows }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      dora: ${{ steps.filter.outputs.dora }}
      update_snapshots: ${{ steps.snapshots.outputs.update_snapshots }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # paths-filter needs full history to diff against PR base
          fetch-depth: 0

      # A baseline-regeneration dispatch runs the e2e job only, and a scheduled run the
      # templates, mcp-replay and dependency-audit-java jobs only: with no filter outputs every
      # other job skips.
      - name: Filter paths
        id: filter
        if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.update_snapshots_ref == '')
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.yml

      # The marker counts only if the PR head still has it AND this PR's diff touches it,
      # so a marker merged to main by mistake cannot trigger regeneration on other PRs.
      - name: Detect visual baseline marker (e2e-tests/.update-snapshots)
        id: snapshots
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker=e2e-tests/.update-snapshots
          if git cat-file -e "$HEAD_SHA:$marker" 2>/dev/null \
            && [ -n "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- "$marker")" ]; then
            echo "update_snapshots=true" >> "$GITHUB_OUTPUT"
            echo "$marker present on the PR head: the e2e job regenerates baselines instead of testing."
          else
            echo "update_snapshots=false" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # Build runtime + test changed Java services in parallel
  # Each matrix entry runs only if its service (or runtime) changed.
  # Runtime change cascades to every service via the filter file.
  # ===========================================================================
  test-java:
    name: Test ${{ matrix.service }}
    needs: changes
    # Services with Testcontainers ITs (worker: RowLevelSecurityIntegrationTest; ai and auth:
    # TenantBindingIntegrationTest; auth: BaselineAdminPasswordIntegrationTest; gateway: its
    # @SpringBootTest suites over GatewayContainers) run on k8s-runner-integration, like the harness job: its
    # Docker publishes container ports where the job can reach them. On k8s-runner the container
    # starts but getHost():getMappedPort() is "Connection refused" — those suites used to be
    # skipped instead. Services without Testcontainers stay on the lighter k8s-runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            changed: ${{ (needs.changes.outputs.gateway == 'true' || needs.changes.outputs.maven_build == 'true') && 'true' || 'false' }}
            # Its @SpringBootTest integration suites (real Redis + NATS via Testcontainers) run
            # through failsafe, which the pom enables only under -Pintegration-tests.
            runner: k8s-runner-integration
            mvn_args: -Pintegration-tests
          - service: worker
            changed: ${{ (needs.changes.outputs.worker == 'true' || needs.changes.outputs.maven_build == 'true') && 'true' || 'false' }}
            runner: k8s-runner-integration
          - service: auth
            changed: ${{ (needs.changes.outputs.auth == 'true' || needs.changes.outputs.maven_build == 'true') && 'true' || 'false' }}
            runner: k8s-runner-integration
          - service: ai
            changed: ${{ (needs.changes.outputs.ai == 'true' || needs.changes.outputs.maven_build == 'true') && 'true' || 'false' }}
            runner: k8s-runner-integration
          - service: mcp
            changed: ${{ (needs.changes.outputs.mcp == 'true' || needs.changes.outputs.maven_build == 'true') && 'true' || 'false' }}
            runner: k8s-runner
    # The integration filter, not any_java: integration-tests needs this job, so a harness-only
    # change must not skip it. Its matrix entries still skip per service via matrix.changed.
    if: (needs.changes.outputs.integration == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true' && needs.changes.outputs.workflows != 'true'
        run: |
          echo "No changes affecting ${{ matrix.service }} — skipping."
          exit 0

      - name: Checkout code
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Maven
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
          fi
          # Route all Maven traffic through the homelab Nexus proxy so direct
          # mvn calls on the runner share the same mirror as the Docker builds
          # (otherwise harness builds hit Maven Central directly and 429 us).
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Build runtime modules
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        run: mvn clean install -DskipTests -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-messaging-nats,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema -am -B

      - name: Test ${{ matrix.service }}
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        env:
          # Ryuk (Testcontainers' reaper) can't be reached on this runner's shared Docker
          # daemon, and without this Testcontainers reports "no Docker" — every
          # @Testcontainers(disabledWithoutDocker = true) suite is then SKIPPED and the job
          # stays green. Same setting as the harness job below.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn verify -f kelta-${{ matrix.service }}/pom.xml -B ${{ matrix.mvn_args }}

      - name: Assert integration tests ran (not skipped)
        if: matrix.changed == 'true' || needs.changes.outputs.workflows == 'true'
        run: scripts/ci/assert-integration-tests-ran.sh kelta-${{ matrix.service }}/target/surefire-reports kelta-${{ matrix.service }}/target/failsafe-reports

      - name: Upload test results
        # Artifact upload occasionally hits transient ENOTFOUND on the self-
        # hosted runner — don't let that mask a green test run.
        continue-on-error: true
        if: always() && (matrix.changed == 'true' || needs.changes.outputs.workflows == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: java-test-results-${{ matrix.service }}
          path: |
            kelta-${{ matrix.service }}/target/surefire-reports/
            kelta-${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        continue-on-error: true
        if: always() && (matrix.changed == 'true' || needs.changes.outputs.workflows == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: java-coverage-${{ matrix.service }}
          path: kelta-${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Test the runtime modules themselves.
  #
  # The test-java matrix above builds them with -DskipTests and then only runs
  # `mvn verify` against kelta-<service>, so until this job existed the runtime
  # modules' ~1,900 tests were compiled and never executed — including the query
  # engine, the storage adapters and their DDL/SQL generation, the flow engine,
  # validation and TenantContext. A FORMULA regression (#1281) consequently sat
  # on green main for eleven days with its own test failing.
  #
  # Runs as its own job rather than by dropping -DskipTests above, so the suite
  # executes once instead of once per service, and reports its own status check.
  # ===========================================================================
  test-runtime:
    name: Test Runtime Modules
    needs: changes
    runs-on: k8s-runner-integration   # Testcontainers ITs — see test-java
    if: (needs.changes.outputs.runtime == 'true' || needs.changes.outputs.maven_build == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Test runtime modules
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"   # see the test-java job
        run: mvn test -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-messaging-nats,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema -am -B

      - name: Assert integration tests ran (not skipped)
        run: scripts/ci/assert-integration-tests-ran.sh kelta-platform/runtime/*/target/surefire-reports

      - name: Upload test results
        # Artifact upload occasionally hits transient ENOTFOUND on the self-
        # hosted runner — don't let that mask a green test run.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-results-runtime
          path: kelta-platform/runtime/*/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Build + test runtime-installable modules (kelta-modules/**).
  #
  # These are deliberately OUTSIDE the kelta-platform reactor — they ship as
  # signed JARs installed into a tenant at runtime, not with the platform — so
  # nothing else in CI compiles them. Without this job a change to KeltaModule,
  # ActionHandler, ModuleContext or any SPI type they use breaks every shipped
  # module silently, and the break only surfaces when an operator uploads one.
  #
  # Each module is built independently (no aggregator pom, by design), so the
  # loop installs the platform artifacts first and then runs each module's own
  # build against them.
  # ===========================================================================
  test-runtime-modules:
    name: Test Runtime Modules (installable)
    needs: changes
    runs-on: k8s-runner
    if: (needs.changes.outputs.runtime_modules == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Install platform artifacts modules compile against
        run: mvn install -DskipTests -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema,runtime/runtime-messaging-nats -am -B

      - name: Build and test each installable module
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for pom in kelta-modules/*/pom.xml; do
            found=1
            echo "::group::$(dirname "$pom")"
            mvn verify -f "$pom" -B
            echo "::endgroup::"
          done
          if [[ "$found" -eq 0 ]]; then
            echo "No installable modules found under kelta-modules/ — nothing to build."
          fi

      - name: Upload test results
        # Artifact upload occasionally hits transient ENOTFOUND on the self-
        # hosted runner — don't let that mask a green test run.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-results-runtime-modules
          path: kelta-modules/*/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Test Frontend (lint, typecheck, unit tests with coverage)
  # Runs when kelta-web or kelta-ui changed (ui depends on web).
  # ===========================================================================
  test-frontend:
    name: Test Frontend
    needs: changes
    if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.sdk_docs == 'true' || needs.changes.outputs.cli_docs == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner
    defaults:
      run:
        working-directory: kelta-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('kelta-web/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Every ```ts / ```tsx block in the SDK docs compiles against packages/*/src.
      - name: Type check SDK doc snippets
        run: npm run check:doc-snippets

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      # -----------------------------------------------------------------------
      # kelta-ui/app types. The prod image builds with bare `vite build`, which
      # skips tsc entirely — so without this step nothing validates kelta-ui/app
      # types and errors accumulate silently on main (22 had, when this was added).
      #
      # kelta-ui/app resolves @kelta/* through the built dist/*.d.ts of the
      # kelta-web packages, so those must be built first or the typecheck
      # reports phantom "has no exported member" errors against a stale dist.
      # -----------------------------------------------------------------------
      - name: Build kelta-web packages (kelta-ui type resolution)
        run: |
          npm run build --workspace=packages/formula
          npm run build --workspace=packages/sdk
          npm run build --workspace=packages/plugin-sdk
          npm run build --workspace=packages/components

      - name: Install kelta-ui dependencies
        working-directory: kelta-ui/app
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5

      # Fails on any unused file, export, type or dependency. Deliberate exceptions
      # live in kelta-ui/app/knip.jsonc, one comment each.
      - name: Knip (unused code) kelta-ui
        working-directory: kelta-ui/app
        run: npm run knip

      - name: Type check kelta-ui
        working-directory: kelta-ui/app
        run: npm run typecheck

      # kelta-ui/app carries 223 vitest files / ~2,700 tests — the admin+builder and
      # end-user UI, the page builder, record shell, realtime client. Until this step
      # existed the job only typechecked them, so none of it ever gated anything.
      - name: Test kelta-ui
        working-directory: kelta-ui/app
        run: npm run test:run

      # PLT-250: ReportViewPage's export race and FieldEditor's async-submission test both
      # timed out intermittently under CI-load contention (concerns.md → "Frontend suite
      # starves under concurrent image builds"), never locally. The fix removed the
      # underlying race/render-count instead of raising the shared asyncUtilTimeout, so
      # re-run each fixed file 5x consecutively here — this job's own log is the evidence,
      # not a one-off green.
      - name: Stability check — previously-flaky tests (5x consecutive)
        working-directory: kelta-ui/app
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::ReportViewPage.test.tsx run $i/5"
            npm run test:run -- src/pages/app/ReportViewPage/ReportViewPage.test.tsx
            echo "::endgroup::"
          done
          for i in 1 2 3 4 5; do
            echo "::group::FieldEditor.test.tsx run $i/5"
            npm run test:run -- src/components/FieldEditor/FieldEditor.test.tsx
            echo "::endgroup::"
          done

      - name: Upload coverage report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: kelta-web/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Cross-service integration tests (Testcontainers harness)
  # Skipped on docs / frontend-only PRs. A runtime, Java service, harness or
  # ci/maven-settings.xml change forces a full run via the integration filter.
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    needs: [changes, test-java]
    if: (needs.changes.outputs.integration == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner-integration
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
          fi
          # Route all Maven traffic through the homelab Nexus proxy so direct
          # mvn calls on the runner share the same mirror as the Docker builds
          # (otherwise harness builds hit Maven Central directly and 429 us).
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Build runtime modules
        run: mvn clean install -DskipTests -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-messaging-nats,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema -am -B

      - name: Build service JARs (required by test harness)
        run: |
          mvn install -DskipTests -f kelta-auth/pom.xml -B
          mvn install -DskipTests -f kelta-worker/pom.xml -B
          mvn install -DskipTests -f kelta-gateway/pom.xml -B

      - name: Pre-pull Docker images
        run: |
          docker pull redis:7-alpine
          docker pull nats:2.10-alpine
          docker pull ghcr.io/cerbos/cerbos:0.40.0
          docker pull eclipse-temurin:25-jre-alpine

      - name: Install psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      # Disabled: the kelta-ci-db pool path was timing out under load. Leaving
      # CI_DB_JDBC_URL unset makes the harness fall back to per-test
      # testcontainers-managed postgres (the "Local dev" branch), which is
      # what integration tests have effectively been running on for months
      # (the checkout step was silently failing and the eval swallowed the
      # error). Re-enable once the pool is reliable enough.
      - name: Checkout CI DB schema
        if: false
        run: |
          eval "$(scripts/ci/checkout-db.sh)"
          echo "::add-mask::$CI_DB_PASSWORD"
          {
            echo "CI_DB_JDBC_URL=$CI_DB_JDBC_URL"
            echo "CI_DB_USER=$CI_DB_USER"
            echo "CI_DB_PASSWORD=$CI_DB_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Pre-build service images
        run: |
          for service in kelta-worker kelta-auth kelta-gateway; do
            jar="${service}/target/${service}-1.0.0-SNAPSHOT.jar"
            ctx=$(mktemp -d)
            cp "$jar" "$ctx/app.jar"
            cat > "$ctx/Dockerfile" <<'EOF'
          FROM eclipse-temurin:25-jre-alpine
          COPY app.jar /app.jar
          ENTRYPOINT ["java", "-Xmx512m", "-XX:MaxMetaspaceSize=256m", "-jar", "/app.jar"]
          EOF
            docker build -t "${service}-harness" "$ctx"
            rm -rf "$ctx"
            echo "Built ${service}-harness"
          done

      - name: Run cross-service harness
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          KELTA_HARNESS_PREBUILT_IMAGES: "true"
          MAVEN_OPTS: "-Xmx1g -XX:MaxMetaspaceSize=384m -Dmaven.wagon.http.retryHandler.count=10 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true -Daether.connector.http.retryHandler.count=10"
        run: mvn verify -f kelta-test-harness/pom.xml -Pintegration-tests -B

      - name: Upload harness reports
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: harness-failsafe-reports
          path: kelta-test-harness/target/failsafe-reports/
          retention-days: 7

      - name: Release CI DB schema
        if: false
        run: scripts/ci/release-db.sh

  # ===========================================================================
  # E2E tests (Playwright) — spins up the full docker-compose stack using the
  # JVM-mode service Dockerfiles from docker-compose.ci.yml so PR feedback stays
  # under ~25 min instead of the ~50 min a native GraalVM build would cost.
  # Native images are still validated post-merge by build-and-publish-containers.yml.
  #
  # Two shards (PLT-868): the serial Playwright step (one worker, ~9.5 min) was the whole
  # PR critical path. Each shard brings up its own stack and runs `--shard=<n>/2` of the
  # suite in the same file order; auth-setup, a dependency project, runs in both. A shard's
  # compose project, cerbos tag, concurrency group and artifact all carry its number.
  # ===========================================================================
  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/2)
    needs: changes
    if: >-
      (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.workflows == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.update_snapshots_ref != ''))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner-integration
    timeout-minutes: 45
    # Both shards always finish, so a red run reports every failing spec, as the
    # single job did.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Per-branch concurrency: cancel an in-flight run when the PR is updated.
    # Cross-PR isolation comes from docker-compose.ci.yml dropping host port
    # bindings and COMPOSE_PROJECT_NAME namespacing container names; Playwright
    # runs inside a container on the compose network so no host ports are needed.
    # Per shard too: without the suffix the two shards share one group and cancel each other.
    concurrency:
      group: e2e-${{ github.head_ref || github.ref }}-shard-${{ matrix.shard }}${{ inputs.update_snapshots_ref && format('-update-snapshots-{0}', inputs.update_snapshots_ref) || '' }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e${{ matrix.shard }}
      # docker-compose.ci.yml's cerbos `image:` tag. Per run AND job (AND shard): the compose
      # jobs share the node's daemon, and a fixed tag let one job's teardown remove the image
      # another had just loaded (PLT-618). Spelled out: job env cannot read env.*.
      CERBOS_CI_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-e2e-${{ matrix.shard }}
      # Playwright's --shard value for this job.
      E2E_SHARD: ${{ matrix.shard }}/2
      # HEAD, not the pinned release the base file pulls: docker-compose.build.yml restores
      # the from-source build stanzas, docker-compose.ci.yml makes the stack safe on the
      # shared daemon, docker-compose.ci-build.yml swaps in the JVM Dockerfiles + CI UI build.
      # Read by every `docker compose` call in this job; the bake step spells the same list out.
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml:docker-compose.ci.yml:docker-compose.ci-build.yml
      # Turns on docker-compose.ci.yml's kelta-mcp (profile mcp) for every `docker compose`
      # call in this job, so `up --wait` waits for it too. Only this job sets it: the
      # quickstart, templates and upgrade stacks never see kelta-mcp.
      COMPOSE_PROFILES: mcp
      # docker compose builds a service whose image it cannot find (the bake step's
      # --load images are not tagged with compose's <project>-<service> names), and it
      # builds with the CURRENT builder. setup-buildx-action used to make its builder
      # current; the persistent kelta-ci builder must be selected explicitly, or `up`
      # rebuilds cold on the default builder — which blew the Quickstart 300s budget.
      BUILDX_BUILDER: kelta-ci
      # CI-only literals. kelta-auth applies the first on first boot with a forced change
      # (docker-compose.yml passes it through); "Complete platform admin first sign-in"
      # changes it to the second, which Playwright signs in with.
      KELTA_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-admin-secret
      # Set through the forced change, so it must meet the default password policy (no dictionary
      # word, nothing of the admin's name or email — kelta-auth PasswordPolicyService).
      E2E_ADMIN_PASSWORD: ci-e2e-Kp7-Wq3-Zt9
    steps:
      # A baseline-regeneration dispatch builds and tests the target branch; on every other
      # event update_snapshots_ref is empty and checkout keeps its default (the PR merge ref).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.update_snapshots_ref }}

      # A named builder on the node's Docker daemon (the runner mounts the host socket)
      # outlives the job, so its layer cache and the Dockerfiles' per-service ~/.m2 cache
      # mounts carry over between runs. setup-buildx-action created a fresh builder per job
      # and removed it afterwards, so every E2E/Quickstart build re-fetched the whole Maven
      # tree (~11.7k artifacts) from Nexus. A runner pod that has not seen the builder yet
      # re-registers it and attaches to the existing container and its state volume.
      - name: Set up Docker Buildx (persistent kelta-ci builder)
        run: |
          docker buildx inspect kelta-ci >/dev/null 2>&1 \
            || docker buildx create --name kelta-ci --driver docker-container
          docker buildx inspect --bootstrap kelta-ci

      - name: Generate .env (JWK_SET + encryption key)
        run: make setup

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build kelta CLI (agent-authoring benchmark + MCP smoke drive it)
        working-directory: kelta-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build service images (JVM, persistent builder cache)
        run: |
          # The cache is the persistent kelta-ci builder itself (layers + ~/.m2 cache
          # mounts). The type=gha cache this used to set was a silent no-op: buildx drops
          # gha cache entries when ACTIONS_RUNTIME_TOKEN is not in its environment, and a
          # plain run step never has it — every build here ran cold.
          # The label is when this job loaded the image. ci/docker-reclaim.sh ages labelled
          # images by it, not by `Created`, which a cache-served build inherits from the
          # original build and so can already be past the prune age the moment it is loaded.
          docker buildx bake --builder kelta-ci \
            -f docker-compose.yml -f docker-compose.build.yml \
            -f docker-compose.ci.yml -f docker-compose.ci-build.yml \
            --load --set "*.labels.io.kelta.ci.loaded-at=$(date +%s)" \
            kelta-auth kelta-worker kelta-gateway kelta-ui kelta-mcp cerbos

      - name: Start stack
        run: |
          docker compose up -d --wait --wait-timeout 300

      - name: Seed admin + verify health
        run: |
          docker compose --profile seed run --rm kelta-bootstrap

      - name: Complete platform admin first sign-in (forced password change)
        run: |
          docker run --rm -i --network "${COMPOSE_PROJECT_NAME}_kelta-network" \
            -e INITIAL_PASSWORD="$KELTA_BOOTSTRAP_ADMIN_PASSWORD" \
            -e NEW_PASSWORD="$E2E_ADMIN_PASSWORD" \
            curlimages/curl:8.11.0 sh < ci/admin-first-sign-in.sh

      # A fresh tenant + PAT, then `kelta mcp serve --source remote --mcp-url
      # http://kelta-mcp:8080 --toolset all` from a container on the compose network: fails
      # unless the authoring tools are listed and a create_collection reads back through
      # get_collection_schema. See ci/mcp-smoke.sh. Once per run: shard 1 (the shorter one).
      - name: MCP smoke (kelta mcp serve bridging the compose kelta-mcp)
        if: matrix.shard == 1
        timeout-minutes: 10
        run: ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" bash ci/mcp-smoke.sh

      - name: Build Playwright runner image (tests + CLI baked in)
        # Bake e2e-tests + node_modules into a runner image. Bind-mounting the
        # workspace doesn't work with the k8s-runner-integration remote Docker
        # daemon (the daemon host can't see the runner's filesystem).
        #
        # Build context is the repo root (not e2e-tests) so the image can also carry
        # the built kelta-web tree (dist/ + hoisted node_modules — the CLI's own
        # package.json has no deps of its own to bundle, they resolve up to
        # kelta-web/node_modules via normal workspace hoisting) at /kelta-web.
        # agent-authoring.spec.ts resolves the CLI via
        # `../../kelta-web/packages/cli/dist/index.js` from /work/tests, the same
        # relative path cli-smoke.spec.ts already uses.
        run: |
          # The image tag is derived from @playwright/test in e2e-tests/package-lock.json, so the
          # browsers always match the installed package (kelta#1984 failed on a package-only bump).
          PLAYWRIGHT_VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' e2e-tests/package-lock.json)
          if [ -z "$PLAYWRIGHT_VERSION" ] || [ "$PLAYWRIGHT_VERSION" = "null" ]; then
            echo "::error::no @playwright/test version in e2e-tests/package-lock.json"
            exit 1
          fi
          echo "Playwright runner base image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
          # --load: BUILDX_BUILDER selects the docker-container kelta-ci builder, which keeps
          # an unloaded result in its cache only, so `docker run` silently used whatever stale
          # kelta-e2e-runner:local the node already had (old specs; PLT-522).
          docker buildx build --load -t kelta-e2e-runner:local \
            --build-arg PLAYWRIGHT_VERSION="$PLAYWRIGHT_VERSION" -f - . <<'DOCKERFILE'
          ARG PLAYWRIGHT_VERSION
          FROM mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
          WORKDIR /work
          COPY e2e-tests/package.json e2e-tests/package-lock.json ./
          RUN npm ci
          COPY e2e-tests/ .
          COPY kelta-web /kelta-web
          DOCKERFILE

      # One environment for every Playwright container in this job (tests and baseline
      # regeneration). docker reads --env-file on the client, so the remote daemon is fine.
      - name: Write Playwright runner environment
        run: |
          cat > "$RUNNER_TEMP/e2e-runner.env" <<EOF
          CI=true
          E2E_BASE_URL=http://kelta-ui:8080
          E2E_API_BASE_URL=http://kelta-gateway:8080
          E2E_AUTH_BASE_URL=http://kelta-auth:8081
          E2E_AUTH_DIRECT_LOGIN_URL=http://kelta-auth:8081
          E2E_BROWSER_HOST_RULES=MAP auth.localhost kelta-auth
          E2E_BROWSER_SECURE_ORIGINS=http://kelta-ui:8080,http://kelta-auth:8081
          E2E_REAL_SIGN_IN=true
          E2E_MAILPIT_URL=http://mailpit:8025
          E2E_EPHEMERAL_STACK=true
          E2E_TENANT_SLUG=default
          E2E_TEST_USERNAME=admin
          E2E_TEST_PASSWORD=$E2E_ADMIN_PASSWORD
          EOF

      # Visual baselines (*-snapshots/*-chromium-linux.png) can only be produced here, so a PR
      # regenerates its own: add e2e-tests/.update-snapshots (one spec per line, relative to
      # e2e-tests/) or dispatch this workflow with update_snapshots_ref/_specs. ci/update-snapshots.sh
      # runs --update-snapshots, commits the PNGs + the marker deletion to the head branch and
      # exits 1, so `Run Playwright tests` below does not run; the push starts a normal run.
      # ARGOCD_REPO_TOKEN (a PAT), never GITHUB_TOKEN: a GITHUB_TOKEN push triggers no workflow.
      # Shard 1 only (it regenerates every listed spec, whichever shard holds it): two shards
      # would push two commits to the same head.
      - name: Regenerate visual baselines (commit + push to the head branch, then fail)
        id: update_snapshots
        if: >-
          matrix.shard == 1
          && ((github.event_name == 'pull_request'
            && needs.changes.outputs.update_snapshots == 'true'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.ref != 'main')
          || (github.event_name == 'workflow_dispatch'
            && inputs.update_snapshots_ref != ''
            && inputs.update_snapshots_ref != 'main'))
        timeout-minutes: 30
        env:
          SNAPSHOTS_REF: ${{ github.event.pull_request.head.ref || inputs.update_snapshots_ref }}
          SNAPSHOTS_SPECS: ${{ inputs.update_snapshots_specs }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          E2E_ENV_FILE: ${{ runner.temp }}/e2e-runner.env
        run: |
          # The stack and runner image were built from this checkout; refuse to commit
          # baselines onto a head that has moved since.
          EXPECTED_SHA="${PR_HEAD_SHA:-$(git rev-parse HEAD)}" bash ci/update-snapshots.sh

      - name: Run Playwright tests (sibling container on compose network)
        id: playwright
        run: |
          NETWORK="${COMPOSE_PROJECT_NAME}_kelta-network"
          CONTAINER="${COMPOSE_PROJECT_NAME}_kelta-e2e-run"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run --name "$CONTAINER" \
            --network "$NETWORK" \
            --env-file "$RUNNER_TEMP/e2e-runner.env" \
            kelta-e2e-runner:local \
            npx playwright test --shard="$E2E_SHARD"

      - name: Copy Playwright reports out of container
        if: always() && steps.playwright.outcome != 'skipped'
        run: |
          CONTAINER="${COMPOSE_PROJECT_NAME}_kelta-e2e-run"
          mkdir -p e2e-tests/playwright-report e2e-tests/test-results
          docker cp "$CONTAINER":/work/playwright-report/. e2e-tests/playwright-report/ 2>/dev/null || true
          docker cp "$CONTAINER":/work/test-results/. e2e-tests/test-results/ 2>/dev/null || true
          docker rm -f "$CONTAINER" || true

      - name: Report agent-authoring benchmark request count
        if: always() && steps.playwright.outcome != 'skipped'
        run: |
          COUNT_FILE="e2e-tests/test-results/agent-authoring-request-count.txt"
          if [ -f "$COUNT_FILE" ]; then
            COUNT="$(cat "$COUNT_FILE")"
            {
              echo "### Agent-authoring benchmark (K-9)"
              echo ""
              echo "HTTP requests for the full authoring sequence (layouts x2, list-views x4, dashboard, page apply+publish, menu): **${COUNT} / 20**"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Agent-authoring benchmark (K-9)"
              echo ""
              echo "No request-count report found in shard ${E2E_SHARD} (agent-authoring.spec.ts is in the other shard, or did not run or was skipped)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p _logs
          for s in kelta-auth kelta-worker kelta-gateway kelta-ui kelta-mcp postgres redis nats cerbos; do
            docker compose logs --no-color "$s" > "_logs/${s}.log" 2>&1 || true
          done

      - name: Upload e2e artifacts
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
            _logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack + remove volumes
        if: always()
        run: |
          # --profile replaces COMPOSE_PROFILES, so mcp is named again or kelta-mcp outlives `down`.
          docker compose --profile ai --profile tools --profile seed --profile mcp down -v --rmi local || true
          # `down --rmi local` skips images with a custom `image:` tag, so cerbos goes explicitly.
          docker image rm "kelta-cerbos-ci:${CERBOS_CI_TAG}" 2>/dev/null || true

      # The node's Docker daemon is shared and nothing else cleans it; see ci/docker-reclaim.sh.
      # Guarded because an update_snapshots_ref dispatch can check out a branch without it.
      - name: Reclaim shared Docker disk
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ -f ci/docker-reclaim.sh ]; then bash ci/docker-reclaim.sh; else echo "ci/docker-reclaim.sh not on this ref, skipping"; fi

  # ===========================================================================
  # Quickstart smoke test (K-3) — proves the documented "clone → docker compose
  # up → create your first collection" path actually works and stays fast.
  #
  # Runs what a self-hoster runs: the Kelta release pinned by KELTA_VERSION in
  # .env.example, PULLED from ghcr.io/kelta-io — nothing Kelta is built here
  # (HEAD is exercised by e2e). docker-compose.ci.yml is layered on only for the
  # shared-daemon safety the e2e job also needs (no fixed host ports or
  # container names, CI-baked cerbos config). Images are pulled ahead of the
  # timer, as they used to be built ahead of it, so the number stays comparable
  # to K-3: only the wall clock from `docker compose up` to a successful
  # first-collection API call counts against the 300s budget, and a `timeout 300`
  # around that exact sequence enforces it regardless of where the time goes.
  #
  # The released kelta-ui is built for http://localhost:8080; that is fine here
  # because the check drives the API with curl by service name, never the SPA —
  # the UI only has to come up healthy, as it does for a self-hoster.
  # ===========================================================================
  quickstart:
    name: Quickstart Smoke Test
    needs: changes
    if: (needs.changes.outputs.quickstart == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner-integration
    timeout-minutes: 20
    concurrency:
      group: quickstart-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: qs-${{ github.run_id }}-${{ github.run_attempt }}
      # Per-run, per-job cerbos tag (see the e2e job).
      CERBOS_CI_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-quickstart
      # Only cerbos is built here (CI-baked config, tagged kelta-cerbos-ci:${CERBOS_CI_TAG} so
      # `up` finds it); select the persistent builder anyway so any build `up` does start is
      # warm rather than cold on the default builder.
      BUILDX_BUILDER: kelta-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A named builder on the node's Docker daemon (the runner mounts the host socket)
      # outlives the job, so its layer cache and the Dockerfiles' per-service ~/.m2 cache
      # mounts carry over between runs. setup-buildx-action created a fresh builder per job
      # and removed it afterwards, so every E2E/Quickstart build re-fetched the whole Maven
      # tree (~11.7k artifacts) from Nexus. A runner pod that has not seen the builder yet
      # re-registers it and attaches to the existing container and its state volume.
      - name: Set up Docker Buildx (persistent kelta-ci builder)
        run: |
          docker buildx inspect kelta-ci >/dev/null 2>&1 \
            || docker buildx create --name kelta-ci --driver docker-container
          docker buildx inspect --bootstrap kelta-ci

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 24 runs the .ts helpers directly (native type stripping) — no install step.
          node-version: 24

      # KELTA_VERSION in .env.example and the four ${KELTA_VERSION:-X} compose defaults must
      # name the same release, or a self-hoster whose .env predates KELTA_VERSION runs another.
      - name: Check quickstart pin (.env.example vs docker-compose.yml)
        run: node .github/release/release.ts check-pin

      - name: Generate .env (JWK_SET + encryption key)
        run: make setup

      - name: Build CI cerbos image (config baked in — no Kelta service is built)
        run: |
          docker buildx bake --builder kelta-ci \
            -f docker-compose.yml -f docker-compose.ci.yml \
            --load --set "*.labels.io.kelta.ci.loaded-at=$(date +%s)" \
            cerbos

      - name: Pull released Kelta images (ghcr.io/kelta-io/*:KELTA_VERSION from .env)
        run: |
          grep '^KELTA_VERSION=' .env
          # Only the four Kelta images move out of the timed window (they used to be built
          # out of it); infra images are fetched by `up` exactly as before, keeping the
          # number comparable with K-3's.
          COMPOSE=(docker compose -f docker-compose.yml -f docker-compose.ci.yml)
          SERVICES=(kelta-auth kelta-worker kelta-gateway kelta-ui)
          # `config --images` lists every service's image; keep the released ones.
          mapfile -t IMAGES < <("${COMPOSE[@]}" config --images | grep '^ghcr.io/kelta-io/' | sort)
          # Drop any copy a previous run left on the shared daemon so this times a cold pull,
          # which is what a self-hoster's first `docker compose up` does. An image a concurrent
          # run is using cannot be removed; it is reported as cached instead.
          CACHED=()
          for i in "${IMAGES[@]}"; do
            docker image rm "$i" >/dev/null 2>&1 || true
            if docker image inspect "$i" >/dev/null 2>&1; then CACHED+=("$i"); fi
          done
          START=$(date +%s)
          "${COMPOSE[@]}" pull "${SERVICES[@]}"
          ELAPSED=$(( $(date +%s) - START ))
          {
            echo "### Quickstart image pull (no JDK/Maven, nothing built)"
            echo ""
            echo "Pulled in **${ELAPSED}s**:"
            for i in "${IMAGES[@]}"; do echo "- \`$i\`"; done
            echo ""
            echo "Still cached on the runner's daemon (in use elsewhere): ${CACHED[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-pull curl image (kept out of the timed window)
        run: docker pull curlimages/curl:8.11.0

      - name: 'Time: stack start → first collection created (budget 300s)'
        run: |
          set +e
          START=$(date +%s)
          timeout 300 bash ci/quickstart-run.sh
          RESULT=$?
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "Quickstart wall-clock (stack start → first collection created): ${ELAPSED}s"
          echo "Quickstart wall-clock (stack start → first collection created): **${ELAPSED}s** / 300s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Quickstart did not complete within the 300s budget (timeout or failure) — ${ELAPSED}s elapsed."
            exit 1
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p _logs
          for s in kelta-auth kelta-worker kelta-gateway kelta-ui postgres redis nats cerbos mailpit; do
            docker compose -f docker-compose.yml -f docker-compose.ci.yml \
              logs --no-color "$s" > "_logs/${s}.log" 2>&1 || true
          done

      - name: Upload logs
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quickstart-logs
          path: _logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack + remove volumes
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --rmi local || true
          # `down --rmi local` skips images with a custom `image:` tag, so cerbos goes explicitly.
          docker image rm "kelta-cerbos-ci:${CERBOS_CI_TAG}" 2>/dev/null || true

      # The node's Docker daemon is shared and nothing else cleans it; see ci/docker-reclaim.sh.
      - name: Reclaim shared Docker disk
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ -f ci/docker-reclaim.sh ]; then bash ci/docker-reclaim.sh; else echo "ci/docker-reclaim.sh not on this ref, skipping"; fi

  # ===========================================================================
  # Tenant templates — two checks on one HEAD-built stack:
  #
  # 1. Install (ci/templates-install-check.sh): installs every examples/templates/*/ into
  #    one fresh tenant through its install.sh, which is the one `kelta metadata apply
  #    metadata.json --yes` (the package carries the collections, LIST_VIEW and DASHBOARD
  #    items and the seed rows in its `records` sections), checks each seeded collection's
  #    record count against the rows of its `records` sections, then applies the template's
  #    metadata.json a second time and fails unless that re-apply exits 0 with created 0 and
  #    failed 0 — a re-apply must change nothing, seed rows included (KLT-666).
  # 2. Round trip (ci/templates-roundtrip-check.sh): for each installed template, exports
  #    its collections (`kelta metadata export --collections`), applies the export to a new
  #    empty sandbox, re-exports from the sandbox and fails on any difference between the two
  #    exports once ci/templates-roundtrip-normalise.jq has stripped ids and timestamps. Types
  #    listed in ci/templates-roundtrip-exclusions.txt (each with the task that removes it)
  #    are left out of the diff and named in the output. It runs in the image check 1 built
  #    and also runs when check 1 failed, so one run shows both checks' failing types.
  # 3. First-app tutorial (ci/first-app-runnable.sh): runs the ```bash runnable blocks of
  #    kelta-marketing/src/content/docs/getting-started/first-app.md in one shell against a
  #    new empty sandbox, then re-runs each `kelta … apply` and fails unless it is unchanged.
  #
  # Same compose stack and fresh `default` tenant as the quickstart job, but built from
  # HEAD like the e2e job: a template is written against the current CLI and API, and
  # the released images the quickstart pulls (KELTA_VERSION) lag behind main. A separate
  # job so the quickstart's 300s budget only ever times the quickstart.
  #
  # Bounded at every level: each install.sh runs under `timeout 300` inside the runner
  # container (capped at 1 GiB / 512 pids, so a runaway script fails the job instead of
  # the node), the install and round-trip steps each have their own timeout-minutes, and so
  # does the job. A timed-out step is a failure, so the compose-log dump below still runs.
  # ===========================================================================
  templates:
    name: Template Install Check
    needs: changes
    if: >-
      (needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflows == 'true'
      || github.event_name == 'schedule')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner-integration
    timeout-minutes: 50
    concurrency:
      group: templates-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: tpl-${{ github.run_id }}-${{ github.run_attempt }}
      # Per-run, per-job cerbos tag (see the e2e job).
      CERBOS_CI_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-templates
      # The e2e job's from-source stack (see the comments there).
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml:docker-compose.ci.yml:docker-compose.ci-build.yml
      BUILDX_BUILDER: kelta-ci
      KELTA_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-admin-secret
      # Meets the default password policy (set through the forced change).
      ADMIN_PASSWORD: ci-templates-Kp7-Wq3-Zt9
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx (persistent kelta-ci builder)
        run: |
          docker buildx inspect kelta-ci >/dev/null 2>&1 \
            || docker buildx create --name kelta-ci --driver docker-container
          docker buildx inspect --bootstrap kelta-ci

      - name: Generate .env (JWK_SET + encryption key)
        run: make setup

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build kelta CLI (the templates' install.sh drive it)
        timeout-minutes: 10
        working-directory: kelta-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build service images (JVM, persistent builder cache)
        run: |
          docker buildx bake --builder kelta-ci \
            -f docker-compose.yml -f docker-compose.build.yml \
            -f docker-compose.ci.yml -f docker-compose.ci-build.yml \
            --load --set "*.labels.io.kelta.ci.loaded-at=$(date +%s)" \
            kelta-auth kelta-worker kelta-gateway kelta-ui cerbos

      - name: Start stack
        timeout-minutes: 8
        run: |
          docker compose up -d --wait --wait-timeout 300

      - name: Complete platform admin first sign-in (forced password change)
        timeout-minutes: 2
        run: |
          docker run --rm -i --network "${COMPOSE_PROJECT_NAME}_kelta-network" \
            -e INITIAL_PASSWORD="$KELTA_BOOTSTRAP_ADMIN_PASSWORD" \
            -e NEW_PASSWORD="$ADMIN_PASSWORD" \
            curlimages/curl:8.11.0 sh < ci/admin-first-sign-in.sh

      # Each install.sh is capped at 300s inside the container; this cap covers the image
      # build, the script's own tests and up to three templates at their full 300s.
      - name: Install every template and check its seeded record counts
        id: install
        timeout-minutes: 20
        run: bash ci/templates-install-check.sh

      # Runs after a failed install step too (but not a cancelled or skipped one): a
      # re-apply that changed something fails that step without saying anything about the
      # round trip. Three exports, three empty sandboxes and three applies.
      - name: Template round-trip check
        if: ${{ !cancelled() && (steps.install.outcome == 'success' || steps.install.outcome == 'failure') }}
        timeout-minutes: 10
        run: bash ci/templates-roundtrip-check.sh

      # Runs the ```bash runnable blocks of the first-app tutorial in a fresh empty sandbox
      # (KLT-747). Same gate as the round trip: it needs only the stack, not a green install.
      - name: Run the first-app tutorial's runnable blocks
        if: ${{ !cancelled() && (steps.install.outcome == 'success' || steps.install.outcome == 'failure') }}
        timeout-minutes: 5
        env:
          FIRST_APP_DOC: kelta-marketing/src/content/docs/getting-started/first-app.md
          SANDBOX_NAME: first-app
          TENANT_SLUG: default
        run: bash ci/first-app-runnable.sh

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p _logs
          for s in kelta-auth kelta-worker kelta-gateway kelta-ui postgres redis nats cerbos mailpit; do
            docker compose logs --no-color "$s" > "_logs/${s}.log" 2>&1 || true
          done

      - name: Upload logs
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: templates-logs
          path: _logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack + remove volumes
        if: always()
        run: |
          docker rm -f "${COMPOSE_PROJECT_NAME}_templates" "${COMPOSE_PROJECT_NAME}_roundtrip" "${COMPOSE_PROJECT_NAME}_first_app" 2>/dev/null || true
          docker compose down -v --rmi local || true
          docker image rm "kelta-templates-runner:${COMPOSE_PROJECT_NAME}" "kelta-first-app-runner:${COMPOSE_PROJECT_NAME}" 2>/dev/null || true
          # `down --rmi local` skips images with a custom `image:` tag, so cerbos goes explicitly.
          docker image rm "kelta-cerbos-ci:${CERBOS_CI_TAG}" 2>/dev/null || true

      # The node's Docker daemon is shared and nothing else cleans it; see ci/docker-reclaim.sh.
      - name: Reclaim shared Docker disk
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ -f ci/docker-reclaim.sh ]; then bash ci/docker-reclaim.sh; else echo "ci/docker-reclaim.sh not on this ref, skipping"; fi

  # ===========================================================================
  # MCP replay call count (K-12) — replays the applicant-tracking template's MCP-only build
  # (examples/templates/applicant-tracking/mcp-replay/calls.json: the tool calls BUILD-LOG.md
  # records, arguments spelled out) through `kelta mcp serve --source remote --mcp-url
  # http://kelta-mcp:8080 --toolset all` against a fresh tenant, and fails when the number of
  # tools/call requests (retries included) grows more than 20% over mcp-replay/baseline.txt.
  # No model and no secret: the "prompt" is the checked-in call list, and the only credentials
  # are the CI-only admin password literal below and the PAT the stack mints for the tenant.
  #
  # The templates job's HEAD-built stack plus kelta-mcp (COMPOSE_PROFILES=mcp, as the e2e job).
  # Runs on the weekly schedule, and when the `mcp_replay` path filter matches (kelta-mcp,
  # the templates, the bridge's CLI source, the replay's ci/ scripts) or `workflows` does.
  # ci/mcp-replay.sh also checks that the template's collections exist and hold the seed files'
  # record counts.
  # ===========================================================================
  mcp-replay:
    name: MCP Replay Call Count
    needs: changes
    if: >-
      (needs.changes.outputs.mcp_replay == 'true' || needs.changes.outputs.workflows == 'true'
      || github.event_name == 'schedule')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner-integration
    timeout-minutes: 45
    concurrency:
      group: mcp-replay-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: mcpr-${{ github.run_id }}-${{ github.run_attempt }}
      # Per-run, per-job cerbos tag (see the e2e job).
      CERBOS_CI_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-mcp-replay
      # The e2e job's from-source stack (see the comments there).
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml:docker-compose.ci.yml:docker-compose.ci-build.yml
      # docker-compose.ci.yml's kelta-mcp, for every `docker compose` call in this job.
      COMPOSE_PROFILES: mcp
      BUILDX_BUILDER: kelta-ci
      KELTA_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-admin-secret
      # Meets the default password policy (set through the forced change).
      ADMIN_PASSWORD: ci-mcpr-Kp7-Wq3-Zt9
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx (persistent kelta-ci builder)
        run: |
          docker buildx inspect kelta-ci >/dev/null 2>&1 \
            || docker buildx create --name kelta-ci --driver docker-container
          docker buildx inspect --bootstrap kelta-ci

      - name: Generate .env (JWK_SET + encryption key)
        run: make setup

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build kelta CLI (its `mcp serve` is the bridge the replay drives)
        timeout-minutes: 10
        working-directory: kelta-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build service images (JVM, persistent builder cache)
        run: |
          docker buildx bake --builder kelta-ci \
            -f docker-compose.yml -f docker-compose.build.yml \
            -f docker-compose.ci.yml -f docker-compose.ci-build.yml \
            --load --set "*.labels.io.kelta.ci.loaded-at=$(date +%s)" \
            kelta-auth kelta-worker kelta-gateway kelta-ui kelta-mcp cerbos

      - name: Start stack
        timeout-minutes: 8
        run: |
          docker compose up -d --wait --wait-timeout 300

      - name: Complete platform admin first sign-in (forced password change)
        timeout-minutes: 2
        run: |
          docker run --rm -i --network "${COMPOSE_PROJECT_NAME}_kelta-network" \
            -e INITIAL_PASSWORD="$KELTA_BOOTSTRAP_ADMIN_PASSWORD" \
            -e NEW_PASSWORD="$ADMIN_PASSWORD" \
            curlimages/curl:8.11.0 sh < ci/admin-first-sign-in.sh

      # A fresh tenant + PAT, then the fixture's tools/call requests over stdio JSON-RPC; writes
      # the count to mcp-replay-count.txt (even when the replay fails part-way) and checks the
      # template's collections and seed counts. See ci/mcp-replay.sh.
      - name: Replay the applicant-tracking MCP build
        id: replay
        timeout-minutes: 15
        run: bash ci/mcp-replay.sh

      - name: Compare the call count with the baseline (fails above +20%)
        id: compare
        run: |
          bash ci/mcp-replay-compare.sh mcp-replay-count.txt \
            examples/templates/applicant-tracking/mcp-replay/baseline.txt

      - name: Report MCP replay call count
        if: always() && steps.replay.outcome != 'skipped'
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          BASELINE="$(tr -d '[:space:]' < examples/templates/applicant-tracking/mcp-replay/baseline.txt)"
          {
            echo "### MCP replay call count (K-12)"
            echo ""
            if [ -f mcp-replay-count.txt ]; then
              COUNT="$(tr -d '[:space:]' < mcp-replay-count.txt)"
              echo "tools/call requests to replay the applicant-tracking build (retries included): **${COUNT}** / baseline **${BASELINE}** (fails above $((BASELINE * 6 / 5)), +20%)"
              if [ "$REPLAY_OUTCOME" != "success" ]; then
                echo ""
                echo "The replay failed after ${COUNT} calls, so this count is partial."
              fi
            else
              echo "No count file (ci/mcp-replay.sh did not get as far as the replay). Baseline: **${BASELINE}**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p _logs
          for s in kelta-auth kelta-worker kelta-gateway kelta-ui kelta-mcp postgres redis nats cerbos; do
            docker compose logs --no-color "$s" > "_logs/${s}.log" 2>&1 || true
          done

      - name: Upload logs
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-replay-logs
          path: _logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack + remove volumes
        if: always()
        run: |
          docker rm -f "${COMPOSE_PROJECT_NAME}_mcp-replay" 2>/dev/null || true
          docker image rm "kelta-mcp-replay:${COMPOSE_PROJECT_NAME}" 2>/dev/null || true
          docker compose down -v --rmi local || true
          # `down --rmi local` skips images with a custom `image:` tag, so cerbos goes explicitly.
          docker image rm "kelta-cerbos-ci:${CERBOS_CI_TAG}" 2>/dev/null || true

      # The node's Docker daemon is shared and nothing else cleans it; see ci/docker-reclaim.sh.
      - name: Reclaim shared Docker disk
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ -f ci/docker-reclaim.sh ]; then bash ci/docker-reclaim.sh; else echo "ci/docker-reclaim.sh not on this ref, skipping"; fi

  # ===========================================================================
  # Upgrade test — upgrades the newest release reachable from HEAD to HEAD on the same Docker
  # volumes and checks that data written on the release reads back unchanged: the path
  # UPGRADING.md tells a self-hoster to take (bump KELTA_VERSION, pull, up; kelta-worker runs
  # Flyway on boot).
  #
  #   1. Resolve the newest v*.*.* tag that is an ancestor of HEAD.
  #   2. Boot that release's ghcr images: docker-compose.yml + docker-compose.ci.yml with
  #      KELTA_VERSION=<tag without the v> (the quickstart job's stack, a different version).
  #   3. Seed a tenant, a collection with five field types, three records and a user through the
  #      API (ci/upgrade-seed.sh) and keep what the release returned (seed.json).
  #   4. `docker compose stop` — containers stop, volumes stay.
  #   5. Start HEAD on the same COMPOSE_PROJECT_NAME, hence the same volumes, built the way the
  #      e2e job builds it (docker-compose.build.yml + docker-compose.ci-build.yml, persistent
  #      kelta-ci builder).
  #   6. ci/upgrade-verify.sh re-reads every seeded resource and fails naming each missing record
  #      or differing field.
  #
  # Runs when the `upgrade` path filter matches — migrations, the compose files, the Dockerfiles,
  # docker/cerbos, .env.example, this file and the job's ci/ scripts — or `workflows` does. It is
  # a quality-gate dependency, so a migration that breaks upgrades blocks the merge. (It was a
  # separate upgrade-test.yml before KLT-576, outside the gate, so a red run did not stop
  # auto-merge.)
  # ===========================================================================
  upgrade:
    name: Upgrade last release to HEAD
    needs: changes
    if: (needs.changes.outputs.upgrade == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner-integration
    timeout-minutes: 35
    concurrency:
      group: upgrade-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        # bash -eo pipefail: the verify step pipes into tee, and must still fail when verify does.
        shell: bash
    env:
      # Fixed for the whole job: both stacks share it, so HEAD starts on the release's volumes.
      COMPOSE_PROJECT_NAME: upg-${{ github.run_id }}-${{ github.run_attempt }}
      # Per-run, per-job cerbos tag (see the e2e job).
      CERBOS_CI_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-upgrade
      # The release stack: released images pinned by KELTA_VERSION, CI-safe overrides.
      RELEASE_COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # The HEAD stack: the e2e job's from-source file set.
      HEAD_COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml:docker-compose.ci.yml:docker-compose.ci-build.yml
      # Select the persistent builder explicitly, or `up` rebuilds cold on the default builder
      # (see the e2e job in ci.yml).
      BUILDX_BUILDER: kelta-ci
      # CI-only literals. The first is applied once, on the release's first boot, with a forced
      # change to the second; HEAD must still accept the second after the upgrade.
      KELTA_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-admin-secret
      # Meets the default password policy (set through the forced change).
      ADMIN_PASSWORD: ci-upgrade-Kp7-Wq3-Zt9
    steps:
      - name: Checkout code (full history + tags, for the release lookup)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the release to upgrade from
        id: release
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*.*.*' HEAD) \
            || { echo "::error::No v*.*.* tag is an ancestor of HEAD — nothing to upgrade from"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Upgrading $TAG ($(git rev-parse --short "$TAG^{commit}")) → HEAD ($(git rev-parse --short HEAD))" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx (persistent kelta-ci builder)
        timeout-minutes: 3
        run: |
          docker buildx inspect kelta-ci >/dev/null 2>&1 \
            || docker buildx create --name kelta-ci --driver docker-container
          docker buildx inspect --bootstrap kelta-ci

      - name: Generate .env (JWK_SET + encryption key)
        run: make setup

      # Docker on this runner is remote: the scripts are baked into a throwaway image rather than
      # bind-mounted. Built from ci/ alone so the context stays small.
      - name: Build the seed/verify runner image
        timeout-minutes: 5
        run: |
          # Labelled like the baked images: it sits unused while the release stack boots.
          docker buildx build --load -q -t "upgrade-runner:${COMPOSE_PROJECT_NAME}" \
            --label "io.kelta.ci.loaded-at=$(date +%s)" -f - ci <<'DOCKERFILE'
          FROM alpine:3.20
          RUN apk add --no-cache bash curl jq coreutils
          COPY upgrade-seed.sh upgrade-verify.sh upgrade-verify.test.sh /ci/
          DOCKERFILE

      - name: Self-test ci/upgrade-verify.sh (stub mode, no stack)
        timeout-minutes: 2
        run: docker run --rm "upgrade-runner:${COMPOSE_PROJECT_NAME}" bash /ci/upgrade-verify.test.sh

      - name: Build HEAD service images (JVM, persistent builder cache)
        timeout-minutes: 15
        run: |
          docker buildx bake --builder kelta-ci \
            -f docker-compose.yml -f docker-compose.build.yml \
            -f docker-compose.ci.yml -f docker-compose.ci-build.yml \
            --load --set "*.labels.io.kelta.ci.loaded-at=$(date +%s)" \
            kelta-auth kelta-worker kelta-gateway kelta-ui cerbos

      - name: Pull release ${{ steps.release.outputs.tag }} images
        timeout-minutes: 6
        env:
          COMPOSE_FILE: ${{ env.RELEASE_COMPOSE_FILE }}
          KELTA_VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker compose config --images | grep "^ghcr.io/kelta-io/.*:${KELTA_VERSION}$"
          timeout 300 docker compose pull kelta-auth kelta-worker kelta-gateway kelta-ui

      - name: Start release ${{ steps.release.outputs.tag }}
        timeout-minutes: 8
        env:
          COMPOSE_FILE: ${{ env.RELEASE_COMPOSE_FILE }}
          KELTA_VERSION: ${{ steps.release.outputs.version }}
        run: timeout 420 docker compose up -d --wait --wait-timeout 300

      - name: Complete platform admin first sign-in (forced password change)
        timeout-minutes: 3
        run: |
          timeout 120 docker run --rm -i --network "${COMPOSE_PROJECT_NAME}_kelta-network" \
            -e INITIAL_PASSWORD="$KELTA_BOOTSTRAP_ADMIN_PASSWORD" \
            -e NEW_PASSWORD="$ADMIN_PASSWORD" \
            curlimages/curl:8.11.0 sh < ci/admin-first-sign-in.sh

      - name: Seed tenant, collection, records and user on the release
        timeout-minutes: 6
        run: |
          mkdir -p _upgrade
          timeout 300 docker run --rm --network "${COMPOSE_PROJECT_NAME}_kelta-network" \
            -e ADMIN_PASSWORD "upgrade-runner:${COMPOSE_PROJECT_NAME}" \
            bash /ci/upgrade-seed.sh > _upgrade/seed.json
          jq . _upgrade/seed.json

      - name: Stop the release stack (volumes kept)
        timeout-minutes: 4
        env:
          COMPOSE_FILE: ${{ env.RELEASE_COMPOSE_FILE }}
          KELTA_VERSION: ${{ steps.release.outputs.version }}
        run: |
          timeout 180 docker compose stop
          # Logs of the release's containers, kept before HEAD recreates them.
          mkdir -p _logs/release
          for s in $(docker compose config --services); do
            timeout 60 docker compose logs --no-color "$s" > "_logs/release/${s}.log" 2>&1 || true
          done
          docker volume inspect --format '{{ .Name }} kept' "${COMPOSE_PROJECT_NAME}_postgres_data"

      - name: Start HEAD on the release's volumes (Flyway migrates on kelta-worker boot)
        timeout-minutes: 15
        env:
          COMPOSE_FILE: ${{ env.HEAD_COMPOSE_FILE }}
        run: timeout 840 docker compose up -d --wait --wait-timeout 420

      - name: Verify every seeded record and the user read back unchanged
        timeout-minutes: 6
        run: |
          timeout 300 docker run --rm -i --network "${COMPOSE_PROJECT_NAME}_kelta-network" \
            -e ADMIN_PASSWORD "upgrade-runner:${COMPOSE_PROJECT_NAME}" \
            bash /ci/upgrade-verify.sh < _upgrade/seed.json | tee _upgrade/verify.txt
          {
            echo "### Upgrade ${{ steps.release.outputs.tag }} → HEAD"
            echo ""
            echo '```'
            cat _upgrade/verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump compose logs on failure (every service)
        if: failure()
        env:
          COMPOSE_FILE: ${{ env.HEAD_COMPOSE_FILE }}
        run: |
          mkdir -p _logs/head
          for s in $(docker compose config --services); do
            timeout 60 docker compose logs --no-color "$s" > "_logs/head/${s}.log" 2>&1 || true
          done
          # The worker's log carries the Flyway run; print its tail inline too.
          tail -n 200 _logs/head/kelta-worker.log || true

      - name: Upload logs and seed data
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test-logs
          path: |
            _logs/
            _upgrade/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack + remove volumes
        if: always()
        env:
          COMPOSE_FILE: ${{ env.HEAD_COMPOSE_FILE }}
        run: |
          timeout 300 docker compose down -v --rmi local || true
          docker image rm "upgrade-runner:${COMPOSE_PROJECT_NAME}" 2>/dev/null || true
          # `down --rmi local` skips images with a custom `image:` tag, so cerbos goes explicitly.
          docker image rm "kelta-cerbos-ci:${CERBOS_CI_TAG}" 2>/dev/null || true

      # The node's Docker daemon is shared and nothing else cleans it; see ci/docker-reclaim.sh.
      - name: Reclaim shared Docker disk
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ -f ci/docker-reclaim.sh ]; then bash ci/docker-reclaim.sh; else echo "ci/docker-reclaim.sh not on this ref, skipping"; fi

  # ===========================================================================
  # The worker image must stay JVM.
  #
  # Runtime module loading needs a bytecode interpreter: SandboxedModuleClassLoader defines classes
  # from an uploaded JAR at runtime, which a native image cannot do. Switching the worker to a
  # native build is a one-line change that produces no error anywhere -- every installed module
  # silently loads as inert handlers. This job exists so that change fails here instead.
  # ===========================================================================
  worker-image-is-jvm:
    name: Worker image is JVM
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8s-runner
    steps:
      - uses: actions/checkout@v7
      - name: Assert the worker builds from Dockerfile.jvm
        run: |
          set -euo pipefail
          wf=.github/workflows/build-and-publish-containers.yml
          # The dockerfile line immediately following `- service: worker`.
          actual=$(grep -A1 '^          - service: worker$' "$wf" \
                   | grep 'dockerfile:' | awk '{print $2}')
          echo "worker dockerfile: ${actual}"
          if [ "${actual}" != "kelta-worker/Dockerfile.jvm" ]; then
            echo "::error::The worker image must build from kelta-worker/Dockerfile.jvm, got '${actual}'."
            echo "A native worker cannot classload an uploaded module JAR, so every installed"
            echo "module becomes inert with no error reported anywhere."
            exit 1
          fi

  # ===========================================================================
  # Quality gate — succeeds when every triggered job succeeded.
  # Jobs that skipped (because their paths didn't change) report `skipped`
  # which is not a failure. Only `failure` and `cancelled` block the gate.
  # ===========================================================================
  # ===========================================================================
  # Dependency vulnerability scanning.
  #
  # Before this, the repo had NO dependency scanning of any kind. OWASP
  # dependency-check was declared in kelta-platform/pom.xml with failBuildOnCVSS=7
  # and a suppressions file — but only inside <pluginManagement>, which configures a
  # plugin without ever running one. No module declared it, no workflow invoked it,
  # and the suppressions file is still the untouched template, so no report had ever
  # been reviewed. There was also no npm audit, no Dependabot and no Renovate.
  #
  # npm side gates the DELTA against ci/npm-audit-baseline.json rather than a plain
  # --audit-level=high, because production deps already carry 33 high/critical
  # advisories; a threshold gate would fail on day one and a red main is a deploy
  # outage, not a signal. Every NEW advisory blocks; the backlog stays listed and
  # burn-down-able instead of silently tolerated.
  # ===========================================================================
  dependency-audit:
    name: Dependency Audit (npm)
    needs: changes
    runs-on: k8s-runner
    if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm audit resolves advisories from the lockfile against the registry; it
      # needs no node_modules, so this deliberately skips the (slow) installs.
      - name: Audit production dependencies
        run: node ci/dependency-audit.mjs

  # ===========================================================================
  # Java dependency audit: the services' SHIPPED classpaths (compile + runtime scope) plus the
  # OpenTelemetry Java agent their Dockerfiles download, against osv.dev. Maven resolves each
  # service into a CycloneDX SBOM, osv-scanner checks the SBOMs, and ci/java-dependency-audit.mjs
  # fails on high/critical advisories not in ci/java-audit-baseline.json (each with a written
  # reason) — the same delta gate as the npm audit above. Needs no API key (the OWASP
  # dependency-check attempt, #1471, died waiting on an NVD key).
  # Also runs on the weekly schedule: advisories are published without any code change here, so
  # a red result on a PR that does not touch dependencies means one was just published.
  # ===========================================================================
  dependency-audit-java:
    name: Dependency Audit (Java)
    needs: changes
    runs-on: k8s-runner
    timeout-minutes: 30
    if: >-
      (needs.changes.outputs.any_java == 'true' || needs.changes.outputs.java_audit == 'true'
      || needs.changes.outputs.maven_build == 'true' || needs.changes.outputs.workflows == 'true'
      || github.event_name == 'schedule')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      OSV_SCANNER_VERSION: '2.7.0'
      # sha256 of osv-scanner_linux_amd64 from the release's osv-scanner_SHA256SUMS
      OSV_SCANNER_SHA256: '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz | tar xz -C /opt
            echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p ~/.m2
          cp ci/maven-settings.xml ~/.m2/settings.xml

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Clean stale Kelta artifacts
        run: rm -rf ~/.m2/repository/io/kelta

      - name: Build runtime modules
        run: mvn clean install -DskipTests -f kelta-platform/pom.xml -pl runtime/runtime-core,runtime/runtime-events,runtime/runtime-messaging-nats,runtime/runtime-jsonapi,runtime/runtime-module-core,runtime/runtime-module-integration,runtime/runtime-module-schema -am -B

      # The binary, pinned and checksum-verified: the runner's remote Docker daemon cannot
      # bind-mount the workspace, so the osv-scanner container image is not an option here.
      - name: Install osv-scanner ${{ env.OSV_SCANNER_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Audit shipped Java dependencies
        run: node ci/java-dependency-audit.mjs

      - name: Upload SBOMs
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-sboms
          path: |
            kelta-*/target/*.cdx.json
            target/java-audit/*.cdx.json
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # Lint the workflow files themselves.
  #
  # Added after a `secrets` context in an `if:` condition broke this whole file:
  # GitHub exposes `secrets` only to `with:`, `env:` and `run:`, never to `if:`.
  # The failure mode is nastier than a normal red build — the file does not parse,
  # so NO jobs run at all (not even Detect Changes), the run is named after the
  # file path instead of "CI", and the PR looks like CI simply has not started.
  # A YAML parse cannot catch it; actionlint can, and does:
  #   context "secrets" is not allowed here. available contexts are "env", ...
  #
  # shellcheck is ON. It started off (`-shellcheck=`) because the workflows
  # carried 22 findings; those were fixed — unquoted $GITHUB_PATH/$GITHUB_OUTPUT
  # redirects, an unquoted kubectl selector, per-line redirects grouped into one
  # block, and a dead `result_var` in quality-gate — so every run: script is now
  # linted like any other shell. Fix new findings rather than re-disabling it.
  #
  # The `if: false` ignore is narrow and deliberate: two CI-DB steps are disabled on
  # purpose (see their comments), and actionlint's advice to delete the `if:` is
  # wrong for them.
  # ===========================================================================
  lint-workflows:
    name: Lint Workflows
    needs: changes
    runs-on: k8s-runner
    if: (needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          curl -fsSL --retry 5 --retry-delay 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin actionlint
          actionlint -version
        env:
          ACTIONLINT_VERSION: 1.7.12

      # Runner labels come from .github/actionlint.yaml; without it the self-hosted
      # pools read as unknown labels and bury the real findings.
      - name: Lint workflows
        run: |
          actionlint -color \
            -ignore 'constant expression "false" in condition'

  # ===========================================================================
  # CI scripts — every ci/ script's own tests, plus a syntax check and shellcheck of
  # ci/*.sh and scripts/ci/*.sh, whenever ci/, scripts/ci/ or the workflows change.
  #
  # Added after #1675 changed ci/update-snapshots.sh: its tests ran only in
  # lint-workflows, which is gated on the workflows filter, so they were skipped and
  # the change broke the script. A ci/ script's tests live next to it as
  # ci/<name>.test.ts or ci/<name>.test.sh; both globs pick a new one up with no edit
  # here. Node 24 because the .test.ts files rely on native type stripping.
  #
  # Every ci/*.test.* file runs here. Some also run elsewhere, on purpose:
  #   - ci/templates-install-check.test.ts also runs inside the templates job's runner
  #     container (ci/templates-install-check.sh), before it installs any template, and
  #     ci/templates-roundtrip-check.test.ts in the same image before the round trip.
  #   - ci/upgrade-verify.test.sh also runs in the upgrade job's seed/verify image,
  #     before that job boots a stack.
  # shellcheck (pinned release, not the runner's apt package) runs at its default
  # severity, the same as actionlint's run: linting in lint-workflows. Fix new
  # findings rather than excluding files.
  # ===========================================================================
  test-ci-scripts:
    name: Test CI Scripts
    needs: changes
    runs-on: k8s-runner
    if: (needs.changes.outputs.ci_scripts == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 24 (the ci/*.test.ts files strip types natively)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ci/templates-install-check.test.ts drives its script with bash, curl, jq and
      # timeout (ci/templates-roundtrip-check.test.ts with bash, curl, jq and diff); ci/upgrade-verify.test.sh needs jq. xz unpacks the shellcheck release.
      - name: Install script dependencies
        run: |
          missing=()
          for tool in curl jq timeout xz; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Installing: ${missing[*]}"
            sudo_cmd=()
            [ "$(id -u)" -eq 0 ] || sudo_cmd=(sudo)
            packages=("${missing[@]/#timeout/coreutils}")
            packages=("${packages[@]/#xz/xz-utils}")
            "${sudo_cmd[@]}" apt-get update
            "${sudo_cmd[@]}" apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          bash --version | head -1
          jq --version

      # Pinned, not apt: the distro package is as old as the runner's base image, and
      # attempt 1 of this job failed on a finding (SC2140) that only shellcheck 0.7.x reports.
      - name: Install shellcheck
        run: |
          mkdir -p "$RUNNER_TEMP/shellcheck"
          curl -fsSL --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck" --strip-components=1
          echo "$RUNNER_TEMP/shellcheck" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck/shellcheck" --version
        env:
          SHELLCHECK_VERSION: 0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87

      - name: Test ci/*.test.ts
        run: node --test ci/*.test.ts

      - name: Test ci/*.test.sh
        run: |
          shopt -s nullglob
          for test in ci/*.test.sh; do
            echo "::group::${test}"
            bash "${test}"
            echo "::endgroup::"
          done

      - name: Syntax-check ci/*.sh and scripts/ci/*.sh
        run: |
          shopt -s nullglob
          for script in ci/*.sh scripts/ci/*.sh; do
            bash -n "${script}"
          done

      - name: Shellcheck ci/*.sh and scripts/ci/*.sh
        run: |
          shopt -s nullglob
          scripts=(ci/*.sh scripts/ci/*.sh)
          shellcheck "${scripts[@]}"

  # ===========================================================================
  # Marketing site (kelta.io) — Astro static build + route guards. NODE_VERSION
  # matches kelta-marketing/Dockerfile, which is what actually ships the site.
  # ===========================================================================
  test-marketing:
    name: Test Marketing Site
    needs: changes
    runs-on: k8s-runner
    if: (needs.changes.outputs.marketing == 'true' || needs.changes.outputs.workflows == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: kelta-marketing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

  # ===========================================================================
  # DORA collector — pure-logic unit tests (scripts/dora/lib.test.mjs). No build.
  # ===========================================================================
  test-dora:
    name: DORA collector tests
    needs: changes
    runs-on: k8s-runner
    if: (needs.changes.outputs.dora == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tests
        run: node --test scripts/dora/lib.test.mjs

      - name: Syntax-check the entry points
        run: |
          node --check scripts/dora/collect.mjs
          node --check scripts/dora/bootstrap-kelta.mjs
          bash -n scripts/dora/emit-deploy-event.sh

  quality-gate:
    name: Quality Gate
    needs: [changes, test-java, test-runtime, test-runtime-modules, test-frontend, test-marketing, integration-tests, e2e, quickstart, templates, mcp-replay, upgrade, worker-image-is-jvm, dependency-audit, dependency-audit-java, lint-workflows, test-ci-scripts, test-dora]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner
    steps:
      - name: Check job results
        run: |
          for job in test-java test-runtime test-runtime-modules test-frontend test-marketing integration-tests e2e quickstart templates mcp-replay upgrade worker-image-is-jvm dependency-audit dependency-audit-java lint-workflows test-ci-scripts test-dora; do
            case "${job}" in
              test-java)         result="${{ needs.test-java.result }}" ;;
              test-runtime)      result="${{ needs.test-runtime.result }}" ;;
              test-runtime-modules) result="${{ needs.test-runtime-modules.result }}" ;;
              test-frontend)     result="${{ needs.test-frontend.result }}" ;;
              test-marketing)    result="${{ needs.test-marketing.result }}" ;;
              integration-tests) result="${{ needs.integration-tests.result }}" ;;
              e2e)               result="${{ needs.e2e.result }}" ;;
              quickstart)        result="${{ needs.quickstart.result }}" ;;
              templates)         result="${{ needs.templates.result }}" ;;
              mcp-replay)        result="${{ needs.mcp-replay.result }}" ;;
              upgrade)           result="${{ needs.upgrade.result }}" ;;
              worker-image-is-jvm) result="${{ needs.worker-image-is-jvm.result }}" ;;
              dependency-audit)  result="${{ needs.dependency-audit.result }}" ;;
              dependency-audit-java) result="${{ needs.dependency-audit-java.result }}" ;;
              lint-workflows)    result="${{ needs.lint-workflows.result }}" ;;
              test-ci-scripts)   result="${{ needs.test-ci-scripts.result }}" ;;
              test-dora)         result="${{ needs.test-dora.result }}" ;;
            esac
            echo "${job}: ${result}"
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "Job ${job} did not pass — quality gate failed."
              exit 1
            fi
          done
          echo "All triggered jobs passed (skipped jobs are allowed)."
