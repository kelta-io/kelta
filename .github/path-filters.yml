# Shared path filters for selective CI builds.
# Used by both ci.yml (PR validation) and build-and-publish-containers.yml (main deploy).
#
# Convention: any change under kelta-platform/runtime/** invalidates every Java
# service since they all depend on the runtime modules. dorny/paths-filter@v3
# flattens one level of nested YAML anchors, so we anchor list patterns and
# splice them via `*alias` references below.

# docs/authoring/system-collections.md is generated and checked by runtime-core's
# SystemCollectionsReferenceTest, so a hand edit to it re-runs the runtime tests.
runtime: &runtime
  - 'kelta-platform/**'
  - 'docs/authoring/system-collections.md'

gateway:
  - *runtime
  - 'kelta-gateway/**'

worker:
  - *runtime
  - 'kelta-worker/**'

auth:
  - *runtime
  - 'kelta-auth/**'

ai:
  - *runtime
  - 'kelta-ai/**'

mcp:
  - *runtime
  - 'kelta-mcp/**'

# Frontend — kelta-ui depends on kelta-web packages, so a web change
# requires rebuilding ui as well.
web: &web
  - 'kelta-web/**'

ui:
  - *web
  - 'kelta-ui/**'

# CLI downloads image — binaries are compiled from kelta-web inside the image.
cli_downloads:
  - *web
  - 'kelta-cli-downloads/**'

# Astro marketing site (kelta.io). The docs engine renders docs/authoring/*.md and
# the generated CLI docs in place, and splices README.md's Quickstart into the docs
# quickstart page, so edits to those must rebuild and redeploy it.
marketing:
  - 'kelta-marketing/**'
  - 'docs/authoring/**'
  - 'kelta-web/packages/cli/COMMANDS.md'
  - 'kelta-web/packages/cli/AGENTS.md'
  - 'README.md'

# SDK doc pages — the "test-frontend" job type-checks their ```ts / ```tsx blocks
# against kelta-web/packages/*/src (npm run check:doc-snippets).
sdk_docs:
  - 'kelta-marketing/src/content/docs/sdk/**'
  - 'docs/**/sdk/**'

# Docs that quote `kelta …` invocations — the "test-frontend" job checks each one against the
# CLI command registry (kelta-web/packages/cli/src/docsgen/docLines.test.ts).
cli_docs:
  - 'kelta-marketing/src/content/docs/**'
  - 'docs/**'
  - 'examples/**'
  - 'README.md'
  - '**/README.md'

# Any Java service change triggers integration tests.
any_java:
  - *runtime
  - 'kelta-gateway/**'
  - 'kelta-worker/**'
  - 'kelta-auth/**'
  - 'kelta-ai/**'
  - 'kelta-mcp/**'

# E2E tests — run on any backend, frontend, or e2e suite change.
e2e:
  - *runtime
  - 'kelta-gateway/**'
  - 'kelta-worker/**'
  - 'kelta-auth/**'
  - 'kelta-ai/**'
  - 'kelta-mcp/**'
  - *web
  - 'kelta-ui/**'
  - 'e2e-tests/**'
  - 'ci/admin-first-sign-in.sh'
  - 'ci/mcp-smoke.sh'
  - 'docker-compose.yml'
  - 'docker-compose.build.yml'
  - 'docker-compose.ci.yml'
  - 'docker-compose.ci-build.yml'

# Runtime-installable modules (kelta-modules/**). Built and tested separately from the
# platform reactor, but they COMPILE AGAINST the runtime API — so a change to KeltaModule,
# ActionHandler, ModuleContext or the SPI types they use breaks them. Anchored on *runtime
# as well as their own tree so a platform change re-verifies every shipped module.
runtime_modules:
  - *runtime
  - 'kelta-modules/**'

# Quickstart smoke test — anything that could break "clone → docker compose up →
# create first collection" for a first-time user.
quickstart:
  - *runtime
  - 'kelta-gateway/**'
  - 'kelta-worker/**'
  - 'kelta-auth/**'
  - *web
  - 'kelta-ui/**'
  - 'docker-compose.yml'
  - 'docker-compose.build.yml'
  - 'docker-compose.jvm.yml'
  - 'docker-compose.ci.yml'
  - 'Makefile'
  - 'docker/bootstrap/**'
  - '.env.example'
  - 'ci/quickstart-*.sh'
  - 'ci/admin-first-sign-in.sh'

# Tenant templates — the "templates" job installs every examples/templates/*/ into one
# fresh tenant of a HEAD-built stack and checks the seeded record counts. Each template's
# install.sh drives the kelta CLI, whose `metadata apply`/`export` call /api/packages/*
# (PackageController → PackageService → PackageImportService), so a change to either side
# can break a template.
templates:
  - 'examples/templates/**'
  - 'ci/templates-install-check.*'
  - 'kelta-web/packages/cli/**'
  - 'kelta-worker/src/main/java/io/kelta/worker/controller/PackageController.java'
  - 'kelta-worker/src/main/java/io/kelta/worker/service/PackageService.java'
  - 'kelta-worker/src/main/java/io/kelta/worker/service/PackageImportService.java'
  - '.github/path-filters.yml'

# MCP replay — the "mcp-replay" job replays the applicant-tracking template's MCP-only build
# (examples/templates/applicant-tracking/mcp-replay/calls.json) through `kelta mcp serve`
# against kelta-mcp and fails when its tools/call count grows more than 20% over the baseline.
# kelta-mcp serves the tools, the templates hold the fixture, the CLI's mcp/ source is the
# bridge, and the replay's own ci/ scripts drive it. The job also runs on the weekly schedule.
mcp_replay:
  - 'kelta-mcp/**'
  - 'examples/templates/**'
  - 'kelta-web/packages/cli/src/mcp/**'
  - 'ci/mcp-replay.*'
  - 'ci/mcp-replay-compare.*'
  - '.github/path-filters.yml'

# Upgrade test — the "upgrade" job boots the newest release, seeds it, upgrades it to HEAD
# on the same volumes and re-reads the data. Anything that can change what an upgrade does
# to existing data: migrations, the compose files both stacks boot (quickstart included),
# the Dockerfiles, the CI cerbos config, the .env template, the job itself and its scripts.
upgrade:
  - 'kelta-worker/src/main/resources/db/migration/**'
  - 'docker-compose*.yml'
  - '**/Dockerfile*'
  - 'docker/cerbos/**'
  - '.env.example'
  - '.github/workflows/ci.yml'
  - 'ci/upgrade-*'
  - 'ci/admin-first-sign-in.sh'

# Workflow plumbing changed — run everything.
workflows:
  - '.github/workflows/**'
  - '.github/path-filters.yml'

# CI scripts — the "test-ci-scripts" job runs every ci/*.test.ts and ci/*.test.sh and
# syntax-checks + shellchecks ci/*.sh and scripts/ci/*.sh (#1675 changed a ci/ script
# whose tests only ran when a workflow changed, and the change broke it).
# It also checks the public endpoint index (ci/endpoint-index.test.ts), so every input of
# ci/endpoint-index.ts is listed: the controller mappings, the gateway route table and path lists,
# the system-collection names, kelta-auth's permitAll list, the permission names, and the docs pages
# the index is published as and links to. A new mapping cannot land without a regenerated index.
ci_scripts:
  - 'ci/**'
  - 'scripts/ci/**'
  - 'kelta-*/src/main/java/**/controller/**'
  - 'kelta-*/src/main/java/**/*Controller.java'
  - 'kelta-platform/runtime/runtime-core/src/main/java/io/kelta/runtime/router/**'
  - 'kelta-platform/runtime/runtime-core/src/main/java/io/kelta/runtime/model/system/**'
  - 'kelta-gateway/src/main/java/io/kelta/gateway/service/RouteConfigService.java'
  - 'kelta-gateway/src/main/java/io/kelta/gateway/config/RouteInitializer.java'
  - 'kelta-gateway/src/main/java/io/kelta/gateway/authz/RouteAuthorizationFilter.java'
  - 'kelta-gateway/src/main/resources/application.yml'
  - 'kelta-auth/src/main/java/io/kelta/auth/config/**'
  - 'kelta-worker/src/main/java/io/kelta/worker/listener/TenantProvisioningHook.java'
  - 'docs/authoring/**'
  - 'kelta-marketing/src/content/docs/**'
  - 'kelta-marketing/src/docs/externalMeta.ts'

# DORA collector (node --test, no build).
dora:
  - 'scripts/dora/**'
