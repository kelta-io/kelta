# CI override, shared by the e2e and quickstart jobs:
#   1. Drop fixed host port bindings — the k8s-runner shares a Docker daemon
#      and ports 5432/6379/4222/8080/8081/8083/5173 collide with concurrent
#      jobs (and leaked containers from prior runs). Playwright runs inside
#      a container joined to the same compose network and reaches services
#      by their container DNS names (kelta-ui, kelta-gateway, kelta-auth).
#   2. Drop `container_name:` so unique COMPOSE_PROJECT_NAME-prefixed names
#      take over, preventing container-name collisions too.
#   3. Allow kelta-ui origin in auth + gateway CORS.
#   4. Bake cerbos config into a CI-only image (bind mounts don't reach the
#      remote daemon), tagged per CI job via CERBOS_CI_TAG so concurrent jobs on
#      the shared daemon never share (or remove) one another's image. `local` when
#      run by hand.
#   5. Add kelta-mcp (not in the base file: it is not part of the self-hosted
#      quickstart) under the `mcp` profile, so CI can drive the MCP authoring
#      tools through `kelta mcp serve` (ci/mcp-smoke.sh). Only a job that sets
#      COMPOSE_PROFILES=mcp (the e2e job) builds or starts it.
#
# Without that profile it builds no Kelta service, so on its own (with
# docker-compose.yml) it runs the released ghcr images pinned by KELTA_VERSION — the
# quickstart job's path. The e2e job adds docker-compose.build.yml +
# docker-compose.ci-build.yml to build HEAD.
#
# Production images continue to be built from each service's original
# Dockerfile by build-and-publish-containers.yml on main.

services:
  postgres:
    container_name: !reset null
    ports: !reset []

  redis:
    container_name: !reset null
    ports: !reset []

  nats:
    container_name: !reset null
    ports: !reset []

  cerbos:
    container_name: !reset null
    ports: !reset []
    # Bind mounts don't work with the remote k8s-runner Docker daemon —
    # bake config + policies into a CI-only image instead.
    build:
      context: ./docker/cerbos
      dockerfile: Dockerfile.ci
    image: kelta-cerbos-ci:${CERBOS_CI_TAG:-local}
    volumes: !reset []

  kelta-auth:
    container_name: !reset null
    ports: !reset []
    environment:
      UI_BASE_URL: http://kelta-ui:8080
      CORS_ALLOWED_ORIGINS: http://kelta-ui:8080
      COOKIE_DOMAIN: kelta-ui

  kelta-worker:
    container_name: !reset null
    ports: !reset []

  kelta-gateway:
    container_name: !reset null
    ports: !reset []
    environment:
      CORS_ALLOWED_ORIGIN_PATTERN: http://kelta-ui:8080

  kelta-ai:
    container_name: !reset null
    ports: !reset []

  kelta-ui:
    container_name: !reset null
    ports: !reset []

  # mailpit + bootstrap also carry fixed container_names in the base compose;
  # reset them too or the hardcoded "kelta-mailpit" collides with leaked/overlapping
  # CI runs ("container name already in use"), failing the whole e2e stack startup.
  mailpit:
    container_name: !reset null
    ports: !reset []

  kelta-bootstrap:
    container_name: !reset null

  # kelta-mcp/Dockerfile is already a JVM build, so docker-compose.ci-build.yml has
  # nothing to swap. Reached by container DNS (http://kelta-mcp:8080) like the rest.
  kelta-mcp:
    profiles: [mcp]
    build:
      context: .
      dockerfile: kelta-mcp/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://kelta-gateway:8080
    depends_on:
      kelta-gateway:
        condition: service_healthy
    healthcheck:
      # Exit code, not `grep UP` (see kelta-gateway in docker-compose.yml): Spring
      # answers 503 when DOWN. curl, as in the image's own HEALTHCHECK.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - kelta-network
