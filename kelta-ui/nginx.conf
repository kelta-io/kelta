server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker scripts must never be immutable. The browser re-fetches /sw.js on its own
    # schedule, but scripts it pulls in via importScripts honour the HTTP cache — a one-year
    # immutable push-handlers.js would mean no installed device ever received a change to it.
    # Exact-match locations win over the regex below.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /push-handlers.js {
        add_header Cache-Control "no-cache";
    }
    # One manifest, served at any tenant path. Its URLs are relative, so requested as
    # /{slug}/manifest.webmanifest its start_url "./app" resolves to /{slug}/app — which is how
    # a Home Screen icon keeps its tenant. Without this rewrite the SPA fallback would answer
    # with index.html and the browser would silently install nothing.
    location ~ ^/[^/]+/manifest\.webmanifest$ {
        rewrite ^ /manifest.webmanifest last;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
