spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
    # This file shadows src/main/resources/application.yml on the test classpath. These were
    # runtime-core's packaged defaults until KLT-750; set here so tests keep the same pool.
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      # Spring Auth Server's default schema also runs; continue-on-error handles
      # the "table already exists" conflict between our schema and theirs.
      continue-on-error: true

kelta:
  auth:
    issuer-uri: http://localhost:8080
    worker-url: http://localhost:8081
    cookie-domain: localhost
    ui-base-url: http://localhost:5173
    cors-allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    io.kelta.auth: DEBUG
