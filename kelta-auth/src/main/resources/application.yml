server:
  port: ${SERVER_PORT:8080}

spring:
  web:
    error:
      # Errors are rendered by io.kelta.auth.controller.AuthErrorController (an HTML page for
      # browsers, JSON otherwise); never Spring Boot's whitelabel page. A literal: it gates
      # auto-configuration, which the native image evaluates at build time.
      whitelabel:
        enabled: false
  threads:
    virtual:
      enabled: true
  application:
    name: kelta-auth

  datasource:
    # runtime-core's jar-packaged application.properties outranked this file until KLT-750, so the
    # DB_URL/DB_USERNAME/DB_PASSWORD placeholders that used to sit here never took effect: only
    # SPRING_DATASOURCE_* (relaxed binding) ever reached this service.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kelta}
    username: ${SPRING_DATASOURCE_USERNAME:kelta}
    password: ${SPRING_DATASOURCE_PASSWORD:kelta}
    driver-class-name: org.postgresql.Driver
    hikari:
      # kelta-auth reads platform_user across tenants by design (login resolves the tenant).
      # The empty sentinel selects the admin_bypass RLS policy on every connection; without it
      # an unset app.current_tenant_id (NULL) matches no policy once the role loses BYPASSRLS
      # and every query returns nothing. Same setting as kelta-ai; see docs/ops/rls-enforcement.md.
      connection-init-sql: SET app.current_tenant_id = ''
      # Until KLT-750 these five came from runtime-core's jar-packaged application.properties,
      # which outranks this file, so the DB_POOL_* placeholders that used to sit here never took
      # effect. They are pinned to the values that actually ran; making DB_POOL_* live again is a
      # separate, deliberate change. SPRING_DATASOURCE_HIKARI_* env vars still override them.
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}
      pool-name: kelta-auth-pool

  data:
    redis:
      # REDIS_HOST/REDIS_PORT fallbacks dropped (KLT-750): runtime-core's properties outranked them.
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # HTTP sessions are stored in Redis (Spring Session), shared by every replica and kept across
  # restarts and rollouts — io.kelta.auth.session.HttpSessionConfig. The cookie and the
  # signed-in timeout are under kelta.auth.session (server.servlet.session.cookie.* is not read).
  session:
    # Idle timeout of a session that has not signed in: login form, saved authorization request,
    # MFA step, federation round trip. A signed-in session gets kelta.auth.session.authenticated-timeout.
    timeout: ${KELTA_AUTH_SESSION_TIMEOUT:30m}
    data:
      redis:
        # A literal, not ${...}: it selects auto-configuration through @ConditionalOnProperty,
        # which the native image evaluates at build time. "indexed" is the store that can list a
        # user's sessions, which the OIDC SessionRegistry needs.
        repository-type: indexed
        namespace: kelta:auth:session
        # The indexed store learns that a session expired from Redis keyspace notifications and
        # turns them on with CONFIG SET at startup. Set "none" where CONFIG is not permitted and
        # set notify-keyspace-events to include "Egx" on the Redis server instead.
        configure-action: ${KELTA_AUTH_SESSION_REDIS_CONFIGURE_ACTION:notify-keyspace-events}

  thymeleaf:
    cache: true

kelta:
  # AES-256 master key for envelope encryption (Base64-encoded 32 bytes)
  # Generate with: openssl rand -base64 32
  encryption:
    key: ${KELTA_ENCRYPTION_KEY:}
  # Login-time OIDC discovery of a tenant-configured issuer, and the token/user-info/JWKS calls
  # during federated login, refuse non-public addresses (loopback, RFC 1918, link-local/metadata,
  # CGNAT, ULA…). List comma-separated CIDRs here only for ranges that legitimately host an
  # identity provider. Same variable as the worker.
  outbound:
    allowed-private-cidrs: ${KELTA_OUTBOUND_ALLOWED_PRIVATE_CIDRS:}
  security:
    # Proxies whose X-Forwarded-For / X-Real-IP are believed when resolving the client IP
    # for the portal per-IP rate limit (PortalPublicRateLimitFilter). Comma-separated
    # CIDRs or bare IPs — set to the ingress pod CIDR. Same rule as the gateway: the
    # client is the right-most untrusted X-Forwarded-For hop, and headers from an
    # untrusted peer are ignored. Empty (default) keeps kelta.auth.rate-limit.trusted-proxy-count.
    trusted-proxies: ${KELTA_SECURITY_TRUSTED_PROXIES:}
  auth:
    # Leave blank to derive the issuer from each request's host (recommended:
    # required for tenant custom domains so tokens carry iss=https://<host>).
    # Set explicitly to pin a single issuer URL.
    issuer-uri: ${KELTA_AUTH_ISSUER_URI:}
    worker-url: ${WORKER_SERVICE_URL:http://localhost:8081}
    # Service-to-service OAuth2 for calls into the worker's /internal/** (rollout flag, off by
    # default). Bound by InternalAuthProperties and read at run time, not by a @Conditional:
    # the native image freezes conditions at build time, so an env flip would be ignored.
    # client-secret must match kelta.auth.internal-clients.<client-id>.secret.
    internal-auth:
      enabled: ${KELTA_AUTH_INTERNAL_AUTH_ENABLED:false}
      client-id: ${KELTA_AUTH_INTERNAL_AUTH_CLIENT_ID:auth-internal}
      client-secret: ${KELTA_AUTH_INTERNAL_AUTH_CLIENT_SECRET:}
    # cookie-domain is no longer read directly — CookieDomainResolver derives
    # the cookie Domain attribute from each request's host. The property is
    # retained as a no-op for migration; remove once all deployments have rolled.
    cookie-domain: ${COOKIE_DOMAIN:}
    # RSA key for JWT signing (JWK JSON format)
    jwk-set: ${JWK_SET:}
    # UI login redirect URL pattern
    ui-base-url: ${UI_BASE_URL:http://localhost:5173}
    # CORS allowed origins
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    session:
      # Idle timeout once the session holds a signed-in user.
      authenticated-timeout: ${KELTA_AUTH_SESSION_AUTHENTICATED_TIMEOUT:8h}
      cookie-name: ${KELTA_AUTH_SESSION_COOKIE_NAME:kelta_auth_session}
      # None | Lax | Strict | blank (attribute left off). None lets an identity provider's
      # cross-site POST to the SAML assertion consumer service carry the session that started
      # the sign-in; Lax or Strict break SP-initiated SAML sign-in. A cookie sent without Secure
      # (below) gets Lax in place of None, which browsers reject without Secure.
      cookie-same-site: ${KELTA_AUTH_SESSION_COOKIE_SAME_SITE:None}
      # auto | always | never — Secure on the session cookie and the kelta_session SSO cookie.
      # auto follows the scheme the browser used: X-Forwarded-Proto (or Forwarded: proto=) from
      # a TLS-terminating proxy, else the request's own scheme. So https behind an ingress gets
      # Secure, plain-http local development and plain-http LAN installs do not (a browser drops
      # a Secure cookie set over http). Set always behind a proxy that terminates TLS without
      # sending X-Forwarded-Proto.
      cookie-secure: ${KELTA_AUTH_SESSION_COOKIE_SECURE:auto}
    # Deletes oauth2_authorization rows whose every token (authorization code, access, refresh,
    # OIDC ID token, device and user code) expired more than `grace` ago — Spring Authorization
    # Server never deletes them (io.kelta.auth.service.AuthorizationRetentionSweep). Batched
    # LIMIT ... FOR UPDATE SKIP LOCKED deletes, so replicas sweeping at once do not block each other.
    authorization-retention:
      enabled: ${KELTA_AUTH_AUTHORIZATION_RETENTION_ENABLED:true}
      interval: ${KELTA_AUTH_AUTHORIZATION_RETENTION_INTERVAL:1h}
      grace: ${KELTA_AUTH_AUTHORIZATION_RETENTION_GRACE:1d}
      batch-size: ${KELTA_AUTH_AUTHORIZATION_RETENTION_BATCH_SIZE:500}
      max-batches: ${KELTA_AUTH_AUTHORIZATION_RETENTION_MAX_BATCHES:100}
    # Enable direct login endpoint for programmatic auth (e2e tests)
    direct-login:
      enabled: ${DIRECT_LOGIN_ENABLED:false}
    # Initial password for the Flyway baseline's platform admin (admin@kelta.local). Applied
    # once, on the first boot that finds the account on the baseline's well-known hash, and
    # the admin must change it at first sign-in. Blank: a random one is generated and printed
    # once in the kelta-auth log (BaselineAdminPasswordInitializer).
    bootstrap-admin-password: ${KELTA_BOOTSTRAP_ADMIN_PASSWORD:}
    rate-limit:
      # Per-IP budgets (requests per 60s window) for the unauthenticated federation
      # endpoints, enforced by PortalPublicRateLimitFilter alongside the portal paths
      # (kelta.auth.rate-limit.ip-paths). Comma-separated <path-prefix>=<limit>; each prefix
      # is its own bucket. Must match PortalPublicRateLimitFilter.DEFAULT_FEDERATION_PATHS
      # (a test checks). Empty disables federation limiting.
      federation-paths: ${KELTA_AUTH_RATE_LIMIT_FEDERATION_PATHS:/oauth2/authorization/=60,/login/oauth2/code/=60,/saml2/authenticate/=60,/saml2/metadata=60,/saml2/service-provider-metadata/=60,/login/saml2/sso/=60,/logout/saml2/slo/=60}
      # Per-IP budgets for the signed-out password reset: the /forgot-password and /reset-password
      # pages and the JSON /auth/password/reset-request and /auth/password/reset. Must match
      # PortalPublicRateLimitFilter.DEFAULT_PASSWORD_RESET_PATHS (a test checks). Empty disables.
      password-reset-paths: ${KELTA_AUTH_RATE_LIMIT_PASSWORD_RESET_PATHS:/auth/password/reset-request=5,/auth/password/reset=10,/forgot-password=10,/reset-password=20}
      # Budget for GET /login carrying tenant or idp_hint (the requests that resolve
      # registrations); its own bucket, never the password form POST. 0 disables.
      login-page-limit: ${KELTA_AUTH_RATE_LIMIT_LOGIN_PAGE_LIMIT:60}
  internal:
    token: ${KELTA_INTERNAL_TOKEN:}
    # Connected app: Superset OAuth2 client registration
    superset-client-id: ${SUPERSET_CLIENT_ID:}
    superset-client-secret: ${SUPERSET_CLIENT_SECRET:}
    superset-redirect-uri: ${SUPERSET_REDIRECT_URI:}

management:
  endpoints:
    web:
      exposure:
        # runtime-core's health,info,metrics outranked the ",prometheus" this list used to carry
        # (KLT-750), so /actuator/prometheus was never exposed; adding it is a separate change.
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  opentelemetry:
    # Every replica must carry a distinct service.instance.id, or the OTLP resource for
    # kelta-auth is identical across pods and Mimir merges all replicas' counters into one
    # series — rate() then treats every replica switch as a counter reset and adds the whole
    # counter value back, inflating request-rate panels. ${HOSTNAME} is the pod name in
    # Kubernetes (unique per replica) and still resolves outside it (container/host id).
    resource-attributes:
      service.instance.id: ${HOSTNAME:local}
    tracing:
      export:
        otlp:
          # MUST be declared here, not left to an env var alone. Spring Boot only
          # creates the OTLP span exporter when this property is SET
          # (OtlpTracingConfigurations.ConnectionDetails is @ConditionalOnProperty on it,
          # with no matchIfMissing, and Exporters is @ConditionalOnBean on that). GraalVM
          # native images freeze condition evaluation at BUILD time, so a value supplied
          # only as a runtime env var arrives too late — the exporter bean is never
          # registered and the service emits no spans at all, silently. Declaring it with
          # a default makes the condition true at AOT time; the env var still overrides
          # the URL at runtime.
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    export:
      enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}

logging:
  level:
    io.kelta.auth: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}

