server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: kelta-worker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kelta_control_plane}
    username: ${SPRING_DATASOURCE_USERNAME:kelta}
    password: ${SPRING_DATASOURCE_PASSWORD:kelta}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}
      pool-name: kelta-worker-pool
  flyway:
    enabled: false   # migrations run via K8s PreSync Job (application-migrate.yml re-enables)
    baseline-on-migrate: true
    baseline-version: 0
    # Kelta migrations never use Flyway ${} placeholders; seed SQL for
    # email_template intentionally stores ${variable} as data for runtime
    # substitution, which would otherwise trip placeholder validation.
    placeholder-replacement: false
    # V1..V161 were flattened into V1__baseline.sql (superseded scripts live in
    # db/migration-archive/, off the classpath). Databases already migrated past
    # the baseline still have V2..V161 in their history with no matching files;
    # tolerate those "missing" entries so validate() passes. A one-time
    # `flyway repair` realigns the V1 checksum on those DBs — see
    # db/migration/README.md. Fresh installs just run V1__baseline.
    ignore-migration-patterns: "*:missing"
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    # Defaults target a local mailpit (SMTP on :1025, no auth, no TLS) so a
    # bare `mvn spring-boot:run` works against the docker-compose stack out of
    # the box. K8s deployments override SMTP_HOST/PORT/USERNAME/PASSWORD/AUTH/
    # STARTTLS via env.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  lifecycle:
    timeout-per-shutdown-phase: 30s

kelta:
  modules:
    # Dev/test only. When true, a module with no JAR loads inert stub handlers that do nothing
    # instead of quarantining. Declared here rather than left to a bare @Value default so it is
    # visible and greppable -- a silently-stubbing module is the failure this release exists to
    # remove.
    stub-mode: ${KELTA_MODULES_STUB_MODE:false}
    # A module load that fails for an infrastructure reason (object storage or the database
    # unreachable) fails closed on that pod and is retried, instead of being persisted QUARANTINED.
    # Backoff doubles from initial-backoff-ms up to max-backoff-ms and never gives up; after
    # escalate-after-attempts consecutive failures it is logged at ERROR again. poll-interval-ms is
    # how often each pod checks for due retries. Runtime-checked, not @Conditional (native images
    # freeze conditions at build time).
    load-retry:
      enabled: ${KELTA_MODULES_LOAD_RETRY_ENABLED:true}
      poll-interval-ms: ${KELTA_MODULES_LOAD_RETRY_POLL_INTERVAL_MS:15000}
      initial-backoff-ms: ${KELTA_MODULES_LOAD_RETRY_INITIAL_BACKOFF_MS:30000}
      max-backoff-ms: ${KELTA_MODULES_LOAD_RETRY_MAX_BACKOFF_MS:600000}
      escalate-after-attempts: ${KELTA_MODULES_LOAD_RETRY_ESCALATE_AFTER_ATTEMPTS:8}
  # AES-256 master key for envelope encryption (Base64-encoded 32 bytes)
  # Generate with: openssl rand -base64 32
  encryption:
    key: ${KELTA_ENCRYPTION_KEY:}
    # The worker cannot run without it (credentials, tenant SMTP, support mailboxes): a blank key
    # fails startup naming KELTA_ENCRYPTION_KEY (EncryptionAutoConfiguration).
    required: true
  # Outbound fetches of tenant-supplied URLs (OIDC discovery, OpenAPI spec import, flow
  # HTTP_CALLOUT/CALL_API/OUTBOUND_MESSAGE, external-rest collections, OAuth 2.0 credential token
  # URLs, Web Push) refuse non-public addresses (loopback, RFC 1918, link-local/metadata, CGNAT,
  # ULA…). List comma-separated CIDRs here only for ranges that legitimately host such targets,
  # e.g. a self-hosted identity provider or an in-cluster service a flow calls. kelta-auth reads
  # the same variable for its OIDC discovery and federated login.
  outbound:
    allowed-private-cidrs: ${KELTA_OUTBOUND_ALLOWED_PRIVATE_CIDRS:}
  auth:
    issuer-uri: ${KELTA_AUTH_ISSUER_URI:https://auth.kelta.io}
    # kelta-auth's in-cluster address (not the public issuer) for service-to-service calls:
    # signing a user out of kelta-auth after an admin password reset, deactivation or removal
    # (AuthSessionRevocationClient, authenticated with kelta.internal.token). Default = the
    # docker-compose service; set it to the Kubernetes service URL in a cluster.
    internal-url: ${KELTA_AUTH_INTERNAL_URL:http://kelta-auth:8081}
  external-base-url: ${EXTERNAL_BASE_URL:http://localhost:8080}
  # Public origin of the web UI (e.g. https://app.example.com). `sandbox create` returns
  # <ui-base-url>/<slug>/login as the sandbox's signInUrl, and <external-base-url>/<slug> as
  # its apiBaseUrl. Falls back to external-base-url for single-host setups.
  ui-base-url: ${KELTA_UI_BASE_URL:${EXTERNAL_BASE_URL:http://localhost:8080}}
  # SMS delivery (MFA verification codes + availability alerts). The default provider only
  # logs; set provider=twilio and the twilio.* secret to send for real (consumer-alerting
  # slice 10). Selecting twilio without the secret still boots — sends fail as FAILED deliveries.
  sms:
    provider: ${KELTA_SMS_PROVIDER:log}   # log | twilio
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}   # AC… — always used in the request URL
      # API key (recommended, revocable): key-sid = SK… + auth-token = its secret.
      # Or leave key-sid blank and set auth-token to the account Auth Token.
      key-sid: ${TWILIO_KEY_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  worker:
    id: ${WORKER_ID:}
    cerbos-cb-threshold: ${CERBOS_CB_THRESHOLD:3}
    cerbos-cb-cooldown-seconds: ${CERBOS_CB_COOLDOWN_SECONDS:10}
    cerbos:
      host: ${CERBOS_HOST:cerbos.emf.svc.cluster.local}
      grpc-port: ${CERBOS_GRPC_PORT:3593}
      seed:
        # Re-push every tenant's policies on startup even if this image already seeded
        # (e.g. after restoring the Cerbos store from backup). Declared here, not env-only.
        force: ${CERBOS_SEED_FORCE:false}
  svix:
    server-url: ${SVIX_SERVER_URL:http://localhost:8071}
    public-url: ${SVIX_PUBLIC_URL:${SVIX_SERVER_URL:http://localhost:8071}}
    auth-token: ${SVIX_AUTH_TOKEN:}
  superset:
    url: ${SUPERSET_URL:}
    public-url: ${SUPERSET_PUBLIC_URL:${SUPERSET_URL:}}
    admin-username: ${SUPERSET_ADMIN_USERNAME:admin}
    admin-password: ${SUPERSET_ADMIN_PASSWORD:}
  flow:
    # Retention for flow/job execution history. Nothing else deletes these tables,
    # so without this they grow without bound.
    # DESTRUCTIVE — dry-run is the DEFAULT: the sweep only logs what it WOULD
    # delete until an operator explicitly sets dry-run=false. Recommended arming:
    # leave dry-run on for a cycle, read the "WOULD delete" counts, then arm.
    # Only terminal executions (COMPLETED/FAILED/CANCELLED) are eligible; RUNNING
    # and WAITING are never deleted, so a parked Wait state is never collected
    # (a stale RUNNING row is first failed by the reaper below).
    # Deleting an execution cascades to its step logs and pending-resume rows.
    # NOTE: purged executions disappear from the flow-run observability UI.
    retention:
      enabled: ${FLOW_RETENTION_ENABLED:true}
      dry-run: ${FLOW_RETENTION_DRY_RUN:true}
      max-age-days: ${FLOW_RETENTION_MAX_AGE_DAYS:60}
      batch-size: ${FLOW_RETENTION_BATCH_SIZE:1000}
      # Caps work per cycle (batch-size x max-batches rows per table), so a first
      # arming against a large backlog drains over several cycles rather than in
      # one enormous delete against a shared database.
      max-batches: ${FLOW_RETENTION_MAX_BATCHES:20}
      poll-interval-ms: ${FLOW_RETENTION_POLL_INTERVAL_MS:3600000}
    # max-age-days is the default window: a flow's own `retentionDays` (flow.retention_days,
    # 1-3650) replaces it for that flow's executions, shorter or longer.
    #
    # Stale-RUNNING reaper, run at the start of each retention cycle (same enabled/dry-run
    # gates and batch-size x max-batches bound). An execution still RUNNING whose latest
    # activity — newest step-log start/finish, its last checkpoint, or its start — is older
    # than this many hours was abandoned by a worker that died mid-run; it is marked FAILED
    # with error_code 'Abandoned' and a completion time, and then ages out like any other
    # failure. WAITING executions are never touched. 0 disables the reaper.
    # Metric: kelta_worker_flow_executions_abandoned.
    stale-running-hours: ${FLOW_STALE_RUNNING_HOURS:24}
    # Step-log snapshot cap. The engine logs the whole flow state as each step's input and
    # output; a flow carrying a large payload through many steps writes it twice per step
    # (one tenant's ingest flows reached ~44 GB of flow_step_log at 60-day retention).
    # Above this many bytes of JSON the persisted snapshot becomes a marker
    # {_truncated, bytes, maxBytes, keys}; the running flow keeps its full state.
    # 0 disables the cap. Metrics: kelta_flow_step_log_bytes, kelta_flow_step_log_snapshots_truncated.
    step-log:
      max-snapshot-bytes: ${FLOW_STEP_LOG_MAX_SNAPSHOT_BYTES:65536}
  email:
    from-address: ${EMAIL_FROM_ADDRESS:noreply@kelta.io}
    from-name: ${EMAIL_FROM_NAME:Kelta Platform}
    enabled: ${EMAIL_ENABLED:true}
  campaigns:
    runner-enabled: ${CAMPAIGN_RUNNER_ENABLED:true}
    poll-interval-ms: ${CAMPAIGN_POLL_INTERVAL_MS:15000}
    batch-size: ${CAMPAIGN_BATCH_SIZE:5}
    # Per-campaign delivery throttle (recipients/second) — spam-rate control.
    send-rate-per-second: ${CAMPAIGN_SEND_RATE_PER_SECOND:20}
    # Fallback daily cap when no per-tenant campaignEmailsPerDay governor limit is set.
    daily-send-limit: ${CAMPAIGN_DAILY_SEND_LIMIT:50000}
    # Public base URL for open-pixel / click-redirect / unsubscribe links (must be reachable).
    tracking-base-url: ${CAMPAIGN_TRACKING_BASE_URL:${EXTERNAL_BASE_URL:http://localhost:8080}}
    # HMAC signing secret for tracking tokens — MUST be overridden in every deployment.
    tracking-secret: ${CAMPAIGN_TRACKING_SECRET:}
  internal:
    token: ${KELTA_INTERNAL_TOKEN:}
  telehealth:
    # HMAC secret for emailed visit links — set in every non-dev environment.
    visit-secret: ${KELTA_TELEHEALTH_VISIT_SECRET:}
    reminders:
      enabled: ${TELEHEALTH_REMINDERS_ENABLED:true}
      offset-minutes: ${TELEHEALTH_REMINDER_OFFSET_MINUTES:60}
      poll-interval-ms: ${TELEHEALTH_REMINDER_POLL_MS:60000}
    livekit:
      # Self-hosted LiveKit SFU (docker-compose --profile telehealth locally;
      # livekit app in homelab-argo for prod). Dev defaults apply when unset.
      url: ${KELTA_LIVEKIT_URL:}
      api-key: ${KELTA_LIVEKIT_API_KEY:}
      api-secret: ${KELTA_LIVEKIT_API_SECRET:}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    poll-interval-ms: ${SCHEDULER_POLL_INTERVAL_MS:60000}
  tempo:
    url: ${TEMPO_URL:http://tempo.observability.svc.cluster.local:3200}
  loki:
    url: ${LOKI_URL:http://loki.observability.svc.cluster.local:3100}
  mimir:
    url: ${MIMIR_URL:http://mimir.observability.svc.cluster.local:8080}
  observability:
    request-logging:
      enabled: ${REQUEST_LOGGING_ENABLED:true}
      max-body-size: 16384
      sensitive-headers: Authorization,Cookie,Set-Cookie,X-Api-Key
      sensitive-body-fields: password,secret,token,apiKey,creditCard,ssn
      exclude-paths: /actuator,/health
  storage:
    mode: PHYSICAL_TABLES
    schema-bootstrap:
      # Whether worker pods apply collection DDL (CREATE TABLE / reconcile) at startup.
      # Off by default: the migrate Job (PreSync hook, `migrate` profile) owns that work and
      # runs it once, before any pod rolls out — N replicas doing it concurrently is the same
      # work N times over, racing itself. Turn on only where no migrate Job runs.
      enabled: ${KELTA_SCHEMA_BOOTSTRAP_ENABLED:false}
    s3:
      enabled: ${KELTA_S3_ENABLED:false}
      endpoint: ${KELTA_S3_ENDPOINT:http://localhost:3900}
      public-endpoint: ${KELTA_S3_PUBLIC_ENDPOINT:https://s3.rzware.com}
      region: ${KELTA_S3_REGION:garage}
      bucket: ${KELTA_S3_BUCKET:kelta-attachments}
      access-key: ${KELTA_S3_ACCESS_KEY:}
      secret-key: ${KELTA_S3_SECRET_KEY:}
      presigned-url-expiry-minutes: ${KELTA_S3_URL_EXPIRY_MINUTES:15}
    media:
      # The media bucket behind media fields (fieldTypeConfig.media — MediaUploadController):
      # objects uploaded straight from a browser and served by presigned GET. Kept apart from
      # the attachments bucket above; see MediaStorageService's javadoc for why it is a separate
      # @Value-bound service. Endpoint, region and credentials default to the attachments
      # store's, so a deployment whose media bucket lives on the same store sets only
      # KELTA_MEDIA_ENABLED and KELTA_MEDIA_BUCKET.
      enabled: ${KELTA_MEDIA_ENABLED:false}
      endpoint: ${KELTA_MEDIA_ENDPOINT:${kelta.storage.s3.endpoint:}}
      public-endpoint: ${KELTA_MEDIA_PUBLIC_ENDPOINT:${kelta.storage.s3.public-endpoint:}}
      region: ${KELTA_MEDIA_REGION:${kelta.storage.s3.region:garage}}
      bucket: ${KELTA_MEDIA_BUCKET:kelta-media}
      access-key: ${KELTA_MEDIA_ACCESS_KEY:${kelta.storage.s3.access-key:}}
      secret-key: ${KELTA_MEDIA_SECRET_KEY:${kelta.storage.s3.secret-key:}}
      # Platform ceiling per object (bytes); a field's fieldTypeConfig.media.maxFileSize can only lower it.
      max-file-size: ${KELTA_MEDIA_MAX_FILE_SIZE:15728640}
      presigned-url-expiry-minutes: ${KELTA_MEDIA_URL_EXPIRY_MINUTES:15}
  nats:
    url: ${NATS_URL:nats://localhost:4222}
    connection-name: kelta-worker

  # Support mailbox. verp-secret signs the Reply-To thread token; the service refuses
  # to start without it, deliberately — an unsigned token is a forgeable one.
  mailbox:
    verp-secret: ${KELTA_MAILBOX_VERP_SECRET:}
    # Where the console lives, for links in escalation emails and pushes. This is the APP host
    # (https://app.kelta.io), not the gateway; falls back to external-base-url only so local
    # single-host setups keep working.
    app-base-url: ${KELTA_MAILBOX_APP_BASE_URL:${EXTERNAL_BASE_URL:http://localhost:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true
    mail:
      enabled: ${kelta.email.enabled:true}
  opentelemetry:
    # Every replica must carry a distinct service.instance.id, or the OTLP resource for
    # kelta-worker is identical across pods and Mimir merges all replicas' counters into
    # one series — rate() then treats every replica switch as a counter reset and adds the
    # whole counter value back, inflating request-rate panels. ${HOSTNAME} is the pod name
    # in Kubernetes (unique per replica) and still resolves outside it (container/host id).
    resource-attributes:
      service.instance.id: ${HOSTNAME:local}
    tracing:
      export:
        otlp:
          # MUST be declared here, not left to an env var alone. Spring Boot only
          # creates the OTLP span exporter when this property is SET
          # (OtlpTracingConfigurations.ConnectionDetails is @ConditionalOnProperty on it,
          # with no matchIfMissing, and Exporters is @ConditionalOnBean on that). GraalVM
          # native images freeze condition evaluation at BUILD time, so a value supplied
          # only as a runtime env var arrives too late — the exporter bean is never
          # registered and the service emits no spans at all, silently. Declaring it with
          # a default makes the condition true at AOT time; the env var still overrides
          # the URL at runtime.
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    export:
      enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  metrics:
    distribution:
      percentiles-histogram:
        kelta_worker_request_duration_seconds: true
      percentiles:
        kelta_worker_request_duration_seconds: 0.5,0.95,0.99
    tags:
      application: ${spring.application.name}

