# Harbor registry integration
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: kelta-gateway

  # Gateway has no static assets to serve. Disabling the static-resource handler
  # prevents the misleading "No static resource X" 404 when a request fails to
  # match a Gateway route — the GlobalErrorHandler / Gateway not-found path now
  # surfaces the actual routing miss instead.
  webflux:
    resources:
      add-mappings: false

  # Request size limits for in-memory buffering
  codec:
    max-in-memory-size: 10MB

  # Redis configuration for caching and rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          min-idle: ${REDIS_POOL_MIN_IDLE:10}
          max-idle: ${REDIS_POOL_MAX_IDLE:50}
          max-active: ${REDIS_POOL_MAX_ACTIVE:100}
          max-wait: ${REDIS_POOL_MAX_WAIT_MS:2000}ms
  
  # Security configuration for JWT validation
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:${JWT_ISSUER_URI:${KELTA_AUTH_ISSUER_URI:http://localhost:8080}}}
  
  # Cloud Gateway configuration
  cloud:
    gateway:
      default-filters:
        - name: RequestSize
          args:
            maxSize: 10MB          # Default 10 MB request body limit
      httpclient:
        connect-timeout: 5000
        response-timeout: 120s
        max-header-size: 16384     # 16 KB max header size to prevent header-based attacks
        pool:
          max-connections: ${GATEWAY_HTTPCLIENT_MAX_CONNECTIONS:2000}
          max-idle-time: ${GATEWAY_HTTPCLIENT_MAX_IDLE_TIME:30s}
          acquire-timeout: ${GATEWAY_HTTPCLIENT_ACQUIRE_TIMEOUT_MS:5000}


# Kelta Gateway specific configuration
kelta:
  nats:
    url: ${NATS_URL:nats://localhost:4222}
    connection-name: kelta-gateway
  gateway:
    # Tenant slug URL prefix configuration
    tenant-slug:
      enabled: ${TENANT_SLUG_ENABLED:true}
      require-prefix: ${TENANT_SLUG_REQUIRE_PREFIX:false}
      platform-paths: /actuator,/platform,/internal,/otel,/api/webhooks,/scim
      cache-refresh-ms: 60000

    # Worker service URL (used for routing AND internal API calls)
    worker-service-url: ${WORKER_SERVICE_URL:http://emf-worker:80}

    # AI service URL (used for routing /api/ai/** requests)
    ai-service-url: ${AI_SERVICE_URL:http://emf-ai:80}
    
    # Rate limiting for AUTHENTICATED traffic is driven by per-tenant governor
    # limits (apiCallsPerDay) fetched from the worker during bootstrap.
    # See GatewayCacheManager for details.
    rate-limit:
      # Per-IP limits for UNAUTHENTICATED paths, which the tenant limiter cannot
      # cover (it needs a principal). Comma-separated <path-prefix>=<per-minute>.
      # Matched by longest prefix; each prefix gets its own per-IP bucket.
      # /api/webhooks/mail is generous on purpose: SNS delivers in bursts from a small
      # pool of AWS IPs, so a tight budget drops real customer mail rather than abuse.
      ip-paths: ${RATE_LIMIT_IP_PATHS:/actuator/health=100,/api/modules/webhooks=300,/api/webhooks/mail=600}
      # IPs / CIDR ranges exempt from ALL rate limiting (per-IP and per-tenant).
      # For trusted infrastructure whose traffic is legitimately bursty: uptime
      # probes, in-cluster callers, a payment processor's webhook egress ranges.
      # A bare address is treated as a single host (/32 or /128). Invalid entries
      # are logged and skipped. Empty (the default) exempts nobody.
      # NOTE: with ip-allowlist.trust-forwarded-for=true the resolved client IP
      # can include client-supplied X-Forwarded-For hops — keep this list to
      # narrow ranges you actually control.
      exempt-cidrs: ${RATE_LIMIT_EXEMPT_CIDRS:}

    # Per-tenant IP allowlist (network access restriction).
    # Non-admin users of a restricted tenant may only reach /api/** from an allowed CIDR;
    # MANAGE_TENANTS holders bypass. Config is fetched at bootstrap and refreshed via NATS.
    ip-allowlist:
      enabled: ${IP_ALLOWLIST_ENABLED:true}   # Global kill-switch for the filter
      # When true, X-Forwarded-For / X-Real-IP hops are considered (resilient to proxy topology
      # but client-spoofable). Set false to match only the socket source address.
      trust-forwarded-for: ${IP_ALLOWLIST_TRUST_XFF:true}

    # IP geolocation enrichment (GeoLite2-City, self-hosted MMDB).
    # The gateway downloads and hot-swaps the database itself (per-pod copy).
    # Fail-open: with no database loaded, requests proceed without X-Geo-* headers.
    geo:
      enabled: ${GEO_ENABLED:true}
      db-path: ${GEO_DB_PATH:/data/geoip/GeoLite2-City.mmdb}
      # Free MaxMind account required — key is a secret; it is never logged.
      license-key: ${MAXMIND_LICENSE_KEY:}
      download-url: https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&suffix=tar.gz
      refresh-ms: ${GEO_REFRESH_MS:86400000}        # re-check daily
      stale-after-days: ${GEO_STALE_AFTER_DAYS:7}   # re-download when older than this
      download-timeout-ms: ${GEO_DOWNLOAD_TIMEOUT_MS:120000}

    # Cerbos authorization engine
    cerbos:
      host: ${CERBOS_HOST:cerbos.emf.svc.cluster.local}
      grpc-port: ${CERBOS_GRPC_PORT:3593}

    # Security settings
    security:
      jwt-clock-skew-seconds: 30   # Tolerance for clock drift between gateway and IdP
      permissions-enabled: ${PERMISSIONS_ENABLED:true}   # Object-level permission enforcement (default: enabled)
      permissions-cache-ttl-minutes: ${PERMISSIONS_CACHE_TTL:5}   # Redis cache TTL for resolved permissions
      # Paths accessible without authentication (GET/HEAD only).
      # Matched as prefixes against the slug-stripped path.
      # These are exactly the endpoints the UI bootstrap fetches before a session exists
      # (kelta-ui/app/src/utils/bootstrapCache.ts) — tenant-scoped presentation metadata:
      # page/menu structure, the tenant's UI translation overlay, the IdP list to render a
      # login button, and the tenant record itself. Writes stay authenticated: this list is
      # GET/HEAD only. Adding a path here also bypasses TenantIpAllowlistFilter, so keep it
      # to metadata that is safe to serve to an anonymous visitor of that tenant.
      public-paths: /api/ui-pages,/api/ui-menus,/api/ui-translations,/api/oidc-providers,/api/tenants
      # Paths accessible without authentication for ALL HTTP methods.
      # Used for endpoints receiving data from unauthenticated sources (e.g., browser OTEL SDK,
      # campaign open-pixel / click-redirect / unsubscribe links authenticated by HMAC token,
      # telehealth visit links authenticated by their signed token, LiveKit webhooks
      # authenticated by their signed JWT + body digest, payment-processor
      # billing webhooks authenticated by their HMAC signature, and runtime-module
      # webhooks where the dispatched module handler owns its own verification).
      # NOTE: an unauthenticated path also bypasses TenantIpAllowlistFilter, so a
      # restricted tenant gets no network restriction there — the endpoint's own
      # signature check is the only trust anchor. Keep these prefixes narrow.
      unauthenticated-paths: /otel,/api/webhooks,/scim,/api/track,/api/telehealth/visits,/api/telehealth/webhooks,/api/modules/webhooks

# Actuator configuration for health and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # The gateway is only READY once its route table is populated.
        # RouteInitializer is an ApplicationRunner, so it runs AFTER the web
        # server starts accepting requests — without this, /actuator/health
        # reports UP while every /api/** request still 404s, and a Kubernetes
        # readiness probe would send real traffic to a pod that cannot route it.
        readiness:
          include: readinessState,routeReadiness
  health:
    redis:
      enabled: true
  opentelemetry:
    # Every replica must carry a distinct service.instance.id, or the OTLP resource for
    # kelta-gateway is identical across pods and Mimir merges all replicas' counters into
    # one series — rate() then treats every replica switch as a counter reset and adds the
    # whole counter value back, inflating request-rate panels. ${HOSTNAME} is the pod name
    # in Kubernetes (unique per replica) and still resolves outside it (container/host id).
    resource-attributes:
      service.instance.id: ${HOSTNAME:local}
    tracing:
      export:
        otlp:
          # MUST be declared here, not left to an env var alone. Spring Boot only
          # creates the OTLP span exporter when this property is SET
          # (OtlpTracingConfigurations.ConnectionDetails is @ConditionalOnProperty on it,
          # with no matchIfMissing, and Exporters is @ConditionalOnBean on that). GraalVM
          # native images freeze condition evaluation at BUILD time, so a value supplied
          # only as a runtime env var arrives too late — the exporter bean is never
          # registered and the service emits no spans at all, silently. Declaring it with
          # a default makes the condition true at AOT time; the env var still overrides
          # the URL at runtime.
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    export:
      enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  metrics:
    distribution:
      percentiles-histogram:
        kelta.gateway.requests: true
      percentiles:
        kelta.gateway.requests: 0.5,0.95,0.99

