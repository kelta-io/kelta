# Local-dev override: JVM images instead of GraalVM native images.
#
# Why this exists
# ---------------
# Layer it on top of docker-compose.build.yml (which supplies the build context and
# drops the pulled ghcr image names); on the base file alone it would build under the
# release's image tag.
#
# The from-source override builds kelta-auth, kelta-worker and kelta-gateway from their
# native `Dockerfile`s, which end in `mvn -Pnative native:compile`. Compose builds
# those three concurrently, and GraalVM's `native-image` sizes its heap to ~80% of
# whatever the cgroup reports — so on a Docker Desktop with, say, 12 GB allocated,
# three builders each try to claim ~9 GB and the build dies with:
#
#     ResourceExhausted: ... did not complete successfully: cannot allocate memory
#
# Running native locally needs ~24 GB allocated to Docker and ~10 min per service.
# For day-to-day work the JVM variants are equivalent in behavior, build in a few
# minutes, and fit comfortably in a default Docker Desktop allocation.
#
# Unlike the CI overrides (which also strip host ports and container_names for the
# shared CI daemon), this override touches ONLY the build stanzas, so
# localhost ports, container names, healthchecks and env all stay as in base.
#
# Usage:  make up-jvm       (or up-jvm-ai / up-jvm-full)
# Native: make up           (unchanged — still the production-parity path)

# Public sources for local builds. The Dockerfile.jvm defaults point at the homelab
# Harbor/Nexus caches CI and production rely on; overriding them HERE — and only here —
# means `make up-jvm` works for anyone, with nothing changed for CI (docker-compose.ci-build.yml
# and the deploy workflow build the same Dockerfiles without these args).
x-public-build-args: &public-build-args
  BASE_REGISTRY: docker.io/library   # official images straight from Docker Hub
  MAVEN_MIRROR: central              # no mirror: resolve from Maven Central directly

services:
  kelta-auth:
    build:
      dockerfile: kelta-auth/Dockerfile.jvm
      args: *public-build-args

  kelta-worker:
    build:
      dockerfile: kelta-worker/Dockerfile.jvm
      args: *public-build-args

  kelta-gateway:
    build:
      dockerfile: kelta-gateway/Dockerfile.jvm
      args: *public-build-args

  kelta-ai:
    build:
      dockerfile: kelta-ai/Dockerfile.jvm
      args: *public-build-args
