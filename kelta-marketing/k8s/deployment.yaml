# Marketing site (kelta.io / www.kelta.io).
#
# This file is the source of truth for the manifests. The `deploy` job of
# .github/workflows/build-and-publish-containers.yml copies it into
# homelab-argo/emf/kelta-marketing.yaml and registers it as a kustomize
# resource, so ArgoCD applies it — edit it here, not in homelab-argo, or the
# next deploy overwrites it. The image tag below stays `:latest`; the same job's
# `kustomize edit set image` pins it to main-<sha>, exactly as for every other
# emf-* image.
#
# Cluster contract (PLT-278 — KLT-268 guessed these three and got all three
# wrong, so the site was never deployed at all):
#   * Namespace is `emf` and workloads are named `emf-<service>` — the same
#     convention `emf-gateway`, `emf-ui`, `emf-auth`, `emf-ai`, `emf-mcp` and
#     `emf-cli-downloads` already use. `namespace: kelta` does not exist, so
#     ArgoCD could not apply these objects.
#   * The ingress controller is **Traefik v3**, not ingress-nginx, so there is
#     no `nginx` IngressClass to select and `nginx.ingress.kubernetes.io/*`
#     annotations are no-ops. `ingressClassName` is deliberately omitted:
#     with Traefik's `providers.kubernetesIngress.ingressClass` unset (the
#     default) it processes Ingresses that carry no class. See
#     CustomDomainProvisioner's javadoc for the same cluster's Traefik contract.
#   * No cert-manager annotation. TLS comes from two things, both required:
#       - `traefik.ingress.kubernetes.io/router.tls: "true"` — Traefik's
#         websecure entrypoint does NOT enable TLS by default (every
#         IngressRoute opts in with `tls:`), and in Traefik v3 the Ingress
#         provider sets router TLS ONLY from this annotation; `spec.tls` alone
#         just loads certificates into the store. Without it the router is
#         plaintext, never matches an HTTPS request, and kelta.io 404s at
#         Traefik (access log shows router "-").
#       - `spec.tls` referencing the existing `emf-tls` Secret (cert-manager
#         Certificate `emf-tls` in the emf namespace: `kelta.io`, `*.kelta.io`)
#         so the wildcard is served for these SNIs. Nothing is re-issued.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emf-marketing
  namespace: emf
  labels:
    app: emf-marketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emf-marketing
  template:
    metadata:
      labels:
        app: emf-marketing
    spec:
      # The emf Harbor project is private; every other emf-* Deployment pulls
      # with this secret. Without it the kubelet gets "pull access denied" and
      # the site sits in ImagePullBackOff (0/2) even though CI verified the tag.
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: emf-marketing
          image: harbor.rzware.com/emf/emf-marketing:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: emf-marketing
  namespace: emf
  labels:
    app: emf-marketing
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: emf-marketing
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emf-marketing
  namespace: emf
  labels:
    app: emf-marketing
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - kelta.io
        - www.kelta.io
      secretName: emf-tls
  rules:
    - host: www.kelta.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emf-marketing
                port:
                  number: 80
    - host: kelta.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emf-marketing
                port:
                  number: 80
