# Marketing site (kelta.io / www.kelta.io).
#
# This file is the source of truth for the manifests. The `deploy` job of
# .github/workflows/build-and-publish-containers.yml copies it into
# homelab-argo/emf/ and registers it as a kustomize resource, so ArgoCD applies
# it — edit it here, not in homelab-argo, or the next deploy overwrites it.
# The image tag below stays `:latest`; the same job's `kustomize edit set image`
# pins it to main-<sha>, exactly as for every other emf-* image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kelta-marketing
  namespace: kelta
  labels:
    app: kelta-marketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kelta-marketing
  template:
    metadata:
      labels:
        app: kelta-marketing
    spec:
      containers:
        - name: kelta-marketing
          image: harbor.rzware.com/emf/emf-marketing:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kelta-marketing
  namespace: kelta
  labels:
    app: kelta-marketing
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: kelta-marketing
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kelta-marketing
  namespace: kelta
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Must name the same ClusterIssuer the other kelta.io hosts (api./app.) use;
    # that name is not knowable from this repo — verify against homelab-argo.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: www.kelta.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kelta-marketing
                port:
                  number: 80
    - host: kelta.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kelta-marketing
                port:
                  number: 80
  tls:
    - hosts:
        - www.kelta.io
        - kelta.io
      secretName: kelta-io-tls
