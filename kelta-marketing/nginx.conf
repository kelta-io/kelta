server {
    listen 80;
    server_name www.kelta.io kelta.io;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pagefind search index. The loaders (pagefind.js, pagefind-ui.js) are not
    # content-hashed, so they must not fall into the 1y-immutable rule below or
    # a Pagefind upgrade would leave browsers running an old loader against a
    # new index. Nested add_header discards the inherited security headers,
    # hence the repeat.
    location ^~ /pagefind/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache static assets aggressively
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Clean URLs for the static Astro build. Deliberately NOT an SPA fallback:
    # an unknown path must answer a real 404 rather than 200-with-the-home-page,
    # or a removed route stays "reachable" (see 404.astro / the removed /pricing
    # route — CHARTER.md §2 treats publishing pricing as a red-zone decision).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
