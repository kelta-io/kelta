server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: kelta-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kelta_control_plane}
    username: ${SPRING_DATASOURCE_USERNAME:kelta}
    password: ${SPRING_DATASOURCE_PASSWORD:kelta}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET app.current_tenant_id = ''
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}
      pool-name: kelta-ai-pool
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: ai_flyway_schema_history
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  lifecycle:
    timeout-per-shutdown-phase: 30s

kelta:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      default-model: ${AI_DEFAULT_MODEL:claude-sonnet-5}
      default-max-tokens: ${AI_DEFAULT_MAX_TOKENS:32768}
      default-temperature: ${AI_DEFAULT_TEMPERATURE:0.7}
    worker-service-url: ${WORKER_SERVICE_URL:http://localhost:8080}
    sse-timeout-ms: ${AI_SSE_TIMEOUT_MS:300000}
    rate-limit:
      enabled: ${AI_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${AI_RATE_LIMIT_REQUESTS_PER_MINUTE:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true
  opentelemetry:
    # Every replica must carry a distinct service.instance.id, or the OTLP resource for
    # kelta-ai is identical across pods and Mimir merges all replicas' counters into one
    # series — rate() then treats every replica switch as a counter reset and adds the whole
    # counter value back, inflating request-rate panels. ${HOSTNAME} is the pod name in
    # Kubernetes (unique per replica) and still resolves outside it (container/host id).
    resource-attributes:
      service.instance.id: ${HOSTNAME:local}
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  tracing:
    export:
      enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    propagation:
      type: w3c

